<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="version" content="1784893969">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bellman Ops">
<title>Bellman Ops v3.0 [1784893969]</title>
<style>

:root{
  --navy:#0d1b2e;--navy2:#162338;--navy3:#1e2f45;
  --gold:#c9a84c;--gold2:#e8c96a;--gdim:rgba(201,168,76,.15);--gbor:rgba(201,168,76,.3);
  --white:#f5f0e8;--muted:rgba(245,240,232,.5);
  --red:#e05252;--redbg:rgba(224,82,82,.12);--redbor:rgba(224,82,82,.3);
  --ora:#e09a2a;--orabg:rgba(224,154,42,.12);--orabor:rgba(224,154,42,.3);
  --grn:#3ab87a;--grnbg:rgba(58,184,122,.12);--grnbor:rgba(58,184,122,.3);
  --blu:#4a90d9;--blubg:rgba(74,144,217,.12);--blubor:rgba(74,144,217,.3);
  --pur:#b06bff;--purbg:rgba(176,107,255,.12);--purbor:rgba(176,107,255,.3);
  --teal:#2ab8a8;--tealbg:rgba(42,184,168,.12);--tealbor:rgba(42,184,168,.3);
  --rose:#e8608a;--rosebg:rgba(232,96,138,.12);--rosebor:rgba(232,96,138,.3);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--navy);color:var(--white);min-height:100vh;overflow-x:hidden;font-size:15px;-webkit-text-size-adjust:100%}

/* HEADER */
.hdr{background:var(--navy2);border-bottom:1px solid var(--gbor);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;min-height:58px}
.hdr-l{display:flex;align-items:center;gap:10px;min-width:0}
/* Logo: Bellman Hotels wordmark */
.logo{display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;user-select:none;flex-shrink:0;padding:2px 0}
.logo-main{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:600;color:var(--gold);letter-spacing:.5px;line-height:1}
.logo-sub{font-family:Georgia,'Times New Roman',serif;font-size:11px;font-weight:400;color:rgba(201,168,76,.65);letter-spacing:2px;text-transform:uppercase;line-height:1;margin-top:1px}
.hsub{font-size:11px;color:var(--muted);padding-left:1px;margin-top:1px}
.chip{display:flex;align-items:center;gap:6px;background:var(--navy3);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:7px 13px;font-size:13px;font-weight:600;flex-shrink:0;min-height:40px}
.chip-av{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.chip-name{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PERSONA BAR */
.pbar{background:rgba(201,168,76,.05);border-bottom:1px solid rgba(201,168,76,.18);padding:8px 14px;display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.pbar::-webkit-scrollbar{display:none}
.pbar-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);opacity:.6;flex-shrink:0}
.pbtn{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:6px 12px 6px 7px;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;min-height:36px}
.pbtn:hover{border-color:var(--gold)}
.pbtn.pon{background:var(--gdim);border-color:var(--gbor)}
.pbtn-av{width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.pbtn-n{font-size:12px;font-weight:600;color:var(--white)}
.pbtn-d{font-size:10px;color:var(--muted)}
.pbar-sep{width:1px;height:22px;background:rgba(255,255,255,.1);flex-shrink:0}

/* TABS */
.mtabs{background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.06);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:199}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex-shrink:0;padding:13px 18px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;user-select:none}
.mtab.on{color:var(--gold);border-bottom-color:var(--gold)}
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:700;margin-left:4px;padding:0 5px;vertical-align:middle}

/* FULLSCREEN / LOGIN */
.fullscreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 20px 48px;overflow-y:auto}
/* Big Bellman logo on login screen */
.biglogo{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.biglogo-main{font-family:Georgia,'Times New Roman',serif;font-size:48px;font-weight:600;color:var(--gold);letter-spacing:1px;line-height:1}
.biglogo-sub{font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:400;color:rgba(201,168,76,.65);letter-spacing:4px;text-transform:uppercase;margin-top:2px}
.biglogo-line{width:60px;height:1px;background:var(--gbor);margin:8px auto 0}
.fullscreen h1{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;color:var(--white);margin-bottom:4px}
.fullscreen>p{font-size:14px;color:var(--muted);margin-bottom:26px;text-align:center}
.dept-section{width:100%;max-width:420px;margin-bottom:20px}
.dept-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.07)}
.staff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{background:var(--navy2);border-radius:12px;padding:16px 15px;cursor:pointer;transition:all .18s;border:1px solid rgba(255,255,255,.08);user-select:none;min-height:62px}
.sbtn:active{transform:scale(.96)}
.sbtn:hover{border-color:var(--gold);background:var(--navy3)}
.sbtn.son{border-color:var(--grn)!important;background:rgba(58,184,122,.08)!important}
.sbtn-name{font-size:16px;font-weight:600;color:var(--white)}
.sbtn-role{font-size:12px;color:var(--muted);margin-top:3px}
.sbtn.son .sbtn-role{color:var(--grn)}
.aform{width:100%;max-width:360px;background:var(--navy2);border:1px solid var(--gbor);border-radius:var(--r);padding:22px;margin-bottom:18px}
.aform h3{font-size:16px;font-weight:600;color:var(--gold);margin-bottom:16px}
.afinp{width:100%;background:var(--navy);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px;outline:none;margin-bottom:11px;transition:border-color .2s}
.afinp:focus{border-color:var(--gold)}
.afinp::placeholder{color:var(--muted)}
.asbtn{width:100%;padding:15px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:700;cursor:pointer;min-height:50px}
.aerr{font-size:13px;color:var(--red);margin-top:8px;text-align:center}

/* MAIN */
.main{padding:14px;max-width:620px;margin:0 auto}

/* SEARCH */
.srchwrap{position:relative;margin-bottom:12px}
.srchinp{width:100%;background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:13px 14px 13px 42px;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;outline:none;transition:border-color .2s;min-height:48px}
.srchinp:focus{border-color:var(--gold)}
.srchinp::placeholder{color:var(--muted)}
.srchico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;opacity:.5}
.srchclr{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:var(--white);width:26px;height:26px;border-radius:13px;font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center}
.srchclr.vis{display:flex}

/* STATS */
.sbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
.sbar3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.sbox{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 6px;text-align:center}
.snum{font-size:22px;font-weight:700;font-family:Georgia,'Times New Roman',serif;line-height:1}
.slbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.sd .snum{color:var(--red)}.sp .snum{color:var(--ora)}.sc .snum{color:var(--grn)}.sr .snum{color:var(--blu)}
.sb .snum{color:var(--teal)}.sg .snum{color:var(--grn)}.srk .snum{color:var(--rose)}

/* ADD BOX */
.addbox{background:var(--navy2);border:1px solid var(--gbor);border-radius:var(--r);padding:14px;margin-bottom:13px}
.addbox h3{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.type-row{display:flex;gap:6px;margin-bottom:10px}
.tbtn{flex:1;padding:11px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;user-select:none;min-height:44px}
.tbtn.tco  {background:var(--redbg);color:var(--red);border-color:var(--redbor)}
.tbtn.tblei{background:var(--tealbg);color:var(--teal);border-color:var(--tealbor)}
.tbtn.tgrn {background:var(--grnbg);color:var(--grn);border-color:var(--grnbor)}
.irow{display:flex;gap:8px}
.inp{flex:1;background:var(--navy);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:13px 14px;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px;outline:none;transition:border-color .2s;min-height:48px}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--muted)}
.badd{border:none;border-radius:10px;padding:13px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:48px}
.badd.co  {background:var(--red);color:#fff}
.badd.blei{background:var(--teal);color:var(--navy)}
.badd.grn {background:var(--grn);color:var(--navy)}
.badd:active{opacity:.8}

/* FILTER TABS */
.ftabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:7px 13px;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;min-height:36px}
.ftab.on{background:var(--gdim);color:var(--gold);border-color:var(--gbor)}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.stitle{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.ldot{width:6px;height:6px;background:var(--grn);border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ROOM CARDS */
.rmc{background:var(--navy2);border-radius:var(--r);padding:14px 15px;margin-bottom:8px;border-left:4px solid transparent;animation:sli .2s ease}
@keyframes sli{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.rmc.dirty        {border-left-color:var(--red);background:linear-gradient(90deg,rgba(224,82,82,.07),var(--navy2))}
.rmc.progress     {border-left-color:var(--ora);background:linear-gradient(90deg,rgba(224,154,42,.07),var(--navy2))}
.rmc.clean        {border-left-color:var(--grn);background:linear-gradient(90deg,rgba(58,184,122,.07),var(--navy2))}
.rmc.ready        {border-left-color:var(--blu);background:linear-gradient(90deg,rgba(74,144,217,.07),var(--navy2))}
.rmc.bleiber      {border-left-color:var(--teal);background:linear-gradient(90deg,rgba(42,184,168,.07),var(--navy2))}
.rmc.bleiber-prog {border-left-color:var(--teal);background:linear-gradient(90deg,rgba(42,184,168,.11),var(--navy2))}
.rmc.bleiber-clean{border-left-color:var(--teal);background:linear-gradient(90deg,rgba(42,184,168,.07),var(--navy2))}
.rmc.green-option {border-left-color:var(--grn);background:linear-gradient(90deg,rgba(58,184,122,.09),var(--navy2))}
.rmc.rote-karte   {border-left-color:var(--rose);background:linear-gradient(90deg,rgba(232,96,138,.09),var(--navy2))}.rmc.technik-block{border-left-color:var(--pur);background:linear-gradient(90deg,rgba(139,92,246,.07),var(--navy2))}.rmc.late-checkout{border-left-color:var(--ora);background:linear-gradient(90deg,rgba(224,154,42,.07),var(--navy2))}.rmc.early-checkin{border-left-color:var(--blu);background:linear-gradient(90deg,rgba(74,144,217,.07),var(--navy2))}
.rmtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.rmnum{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 11px;border-radius:22px}
.pill.dirty        {background:var(--redbg);color:var(--red)}
.pill.progress     {background:var(--orabg);color:var(--ora)}
.pill.clean        {background:var(--grnbg);color:var(--grn)}
.pill.ready        {background:var(--blubg);color:var(--blu)}
.pill.bleiber      {background:var(--tealbg);color:var(--teal)}
.pill.bleiber-prog {background:var(--tealbg);color:var(--teal)}
.pill.bleiber-clean{background:var(--tealbg);color:var(--teal)}
.pill.green-option {background:var(--grnbg);color:var(--grn)}
.pill.rote-karte   {background:var(--rosebg);color:var(--rose)}.pill.technik-block{background:var(--purbg);color:var(--pur)}.pill.late-checkout{background:var(--orabg);color:var(--ora)}.pill.early-checkin{background:var(--blubg);color:var(--blu)}
.tl-row{font-size:12px;color:var(--muted);line-height:2;margin-bottom:6px}
.by-tag{background:var(--navy3);border-radius:5px;padding:2px 7px;font-size:11px;color:rgba(245,240,232,.6)}
.mb-tag   {background:var(--gdim);border:1px solid var(--gbor);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--gold)}
.no-mb-tag{background:var(--redbg);border:1px solid var(--redbor);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--red)}
.info-tag {background:var(--tealbg);border:1px solid var(--tealbor);border-radius:5px;padding:3px 9px;font-size:12px;color:var(--teal);font-weight:600}
.green-tag{background:var(--grnbg);border:1px solid var(--grnbor);border-radius:5px;padding:3px 9px;font-size:12px;color:var(--grn);font-weight:600}
.rose-tag {background:var(--rosebg);border:1px solid var(--rosebor);border-radius:5px;padding:3px 9px;font-size:12px;color:var(--rose);font-weight:600}
.note-tag {background:rgba(201,168,76,.1);border:1px solid var(--gbor);border-radius:5px;padding:3px 9px;font-size:12px;color:var(--gold);display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-inp{background:var(--navy);border:1px solid var(--gbor);border-radius:9px;padding:10px 12px;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;outline:none;width:100%;margin-bottom:8px;min-height:46px}
.note-inp::placeholder{color:var(--muted)}
.nqbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.nqbtn{padding:7px 12px;border-radius:16px;border:1px solid rgba(201,168,76,.25);background:transparent;color:var(--gold);font-size:12px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;transition:all .15s;user-select:none;min-height:36px}
.nqbtn:active{background:var(--gdim)}

/* ACTION BUTTONS */
.arow{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.btn{flex:1;min-width:100px;padding:11px 12px;border-radius:10px;border:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;user-select:none;min-height:46px}
.btn:active{transform:scale(.96)}
.btn-prog {background:var(--orabg);color:var(--ora);border:1px solid var(--orabor)}
.btn-cln  {background:var(--grnbg);color:var(--grn);border:1px solid var(--grnbor)}
.btn-del  {background:var(--redbg);color:var(--red);border:1px solid var(--redbor);font-size:12px}
.btn-gold {background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.btn-teal {background:var(--tealbg);color:var(--teal);border:1px solid var(--tealbor)}
.btn-rose {background:var(--rosebg);color:var(--rose);border:1px solid var(--rosebor)}
.btn-rep  {background:var(--purbg);color:var(--pur);border:1px solid var(--purbor)}
.btn-rprog{background:var(--orabg);color:var(--ora);border:1px solid var(--orabor)}
.btn-rdone{background:var(--grnbg);color:var(--grn);border:1px solid var(--grnbor)}

/* MINIBAR */
.mbox{background:var(--navy);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.mbox label{font-size:12px;color:var(--gold);font-weight:700;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.mb-qbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.mb-qbtn{padding:8px 12px;border-radius:16px;border:1px solid rgba(201,168,76,.2);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;transition:all .15s;user-select:none;min-height:38px}
.mb-qbtn.sel{background:var(--gdim);color:var(--gold);border-color:var(--gbor);font-weight:700}
.mb-summary{font-size:12px;color:var(--gold);min-height:18px}

/* REPAIR */
.repc{background:var(--navy2);border-radius:var(--r);padding:14px 15px;margin-bottom:8px;border-left:4px solid var(--pur);animation:sli .2s ease}
.repc.rp-progress{border-left-color:var(--ora);background:linear-gradient(90deg,rgba(224,154,42,.06),var(--navy2))}
.repc.rp-done    {border-left-color:var(--grn);background:linear-gradient(90deg,rgba(58,184,122,.06),var(--navy2));opacity:.75}
.reptop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.reploc{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;line-height:1.1}
.reploc small{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:12px;font-weight:400;color:var(--muted);display:block;margin-top:2px}
.rppill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border-radius:20px;flex-shrink:0}
.rppill.rp-open    {background:var(--purbg);color:var(--pur);border:1px solid var(--purbor)}
.rppill.rp-progress{background:var(--orabg);color:var(--ora)}
.rppill.rp-done    {background:var(--grnbg);color:var(--grn)}
.repdesc{font-size:14px;line-height:1.5;margin-bottom:7px}
.repimg{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px;cursor:pointer}
.repmeta{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.9}
.repform{background:var(--navy2);border:1px solid var(--purbor);border-radius:var(--r);padding:15px;margin-bottom:14px}

  if(id)clToggle(id);
}
function siDoRoom(el){
  var room=el.getAttribute('data-room');
  var task=el.getAttribute('data-task');
  if(room&&task)siToggleTask(room,task);
  else if(room)siToggleKueche(room);
}
function siDoMenge(el){
  var room=el.getAttribute('data-room2');
  if(room)siSetMenge(room,el.value);
}
function doRoom(el,fn){
  var id=el.getAttribute('data-id');
  if(!id)return;
  if(fn==='technikBlock')technikBlock(id);
  else if(fn==='technikRelease')technikRelease(id);
  else if(fn==='setLateCheckout')setLateCheckout(id);
  else if(fn==='hkLateCOUndo')hkAction(id,'dirty');
  else if(fn==='setEarlyCheckin')setEarlyCheckin(id);
  else if(fn==='removeEarlyCheckin')removeEarlyCheckin(id);
  else if(fn==='doRelease')doRelease(id);
  else if(fn==='removeRoom')removeRoom(id);
  else if(fn==='hkProgress')hkAction(id,'progress');
  else if(fn==='hkClean')hkAction(id,'clean');
  else if(fn==='hkBleiberProg')hkAction(id,'bleiber-prog');
  else if(fn==='hkBleiberClean')hkAction(id,'bleiber-clean');
  else if(fn==='hkRoteKarte')hkAction(id,'rote-karte');
  else if(fn==='hkUndoRote')hkAction(id,'undo-rote-karte');
  else if(fn==='hkGreen')hkAction(id,'green-option');
  else if(fn==='hkUndoGreen')hkAction(id,'undo-green');
}

// ── SHIFTS ───────────────────────────────────────────────────
function sk(n,d){return n+'__'+d;}
function isOn(n,d){var s=shifts[sk(n,d)];return !!(s&&s.date===todS()&&s.inTime&&!s.outTime);}
function getShift(n,d){var s=shifts[sk(n,d)];return(s&&s.date===todS())?s:null;}
function checkin(n,d,floors){
  var f=Array.isArray(floors)?floors:[floors];
  var fStr=f.join(' + ');
  shifts[sk(n,d)]={date:todS(),floors:f,floor:fStr,inTime:nowT(),outTime:null,assignedRooms:[]};
  saveShifts();toast(n+' eingecheckt');render();
}
function checkoutStaff(n,d){
  var k=sk(n,d);
  if(shifts[k])shifts[k].outTime=nowT();
  saveShifts();toast(n+' Schicht beendet');render();
}

// ── FLOOR HELPERS ────────────────────────────────────────────
function getFloorOfRoom(num){
  var n=parseInt(num)||0;
  if(n<100)return '0';
  return String(Math.floor(n/100));
}
function floorOfLabel(label){
  if(label==='EG')return '0';
  var m=label.match(/(\d+)/);
  return m?m[1]:'?';
}

// ── ROOM ACTIONS ─────────────────────────────────────────────
function addRoom(num){
  num=String(num).trim();if(!num)return;
  var active=['dirty','progress','clean','bleiber','bleiber-prog','bleiber-clean','rote-karte','green-option'];
  for(var i=0;i<rooms.length;i++){
    if(rooms[i].number===num&&active.indexOf(rooms[i].status)>=0){toast('Zi. '+num+' bereits aktiv');return;}
  }
  var st=addType==='co'?'dirty':addType==='blei'?'bleiber':'green-option';
  rooms.push({id:gid(),number:num,status:st,tCreated:nowT(),tProg:null,tClean:null,tReady:null,
    minibar:null,byCO:(eu()&&eu().name)||'?',byProg:null,byClean:null,byReady:null,note:'',type:addType});
  saveRooms();toast('Zi. '+num+' eingetragen');render();
}
function addRoteKarte(num){
  num=String(num||'').trim();if(!num){toast('Zimmernummer eingeben');return;}
  for(var i=0;i<rooms.length;i++){
    var r=rooms[i];
    if(r.number===num&&['dirty','progress','bleiber','bleiber-prog'].indexOf(r.status)>=0){
      r.prevStatus=r.status;r.status='rote-karte';r.tClean=nowT();r.byClean=(eu()&&eu().name)||'?';
      saveRooms();toast('Rote Karte: Zi. '+num);render();return;
    }
    if(r.number===num&&r.status==='rote-karte'){toast('Zi. '+num+' bereits Rote Karte');return;}
  }
  rooms.push({id:gid(),number:num,status:'rote-karte',prevStatus:'bleiber',
    tCreated:nowT(),tProg:null,tClean:nowT(),tReady:null,minibar:null,
    byCO:(eu()&&eu().name)||'?',byProg:null,byClean:(eu()&&eu().name)||'?',byReady:null,note:'',type:'blei'});
  saveRooms();toast('Rote Karte: Zi. '+num);render();
}
function hkAction(id,ns){
  var r=null;
  for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){r=rooms[i];break;}}
  if(!r)return;
  var n=(eu()&&eu().name)||'?';
  if(ns==='undo-rote-karte'){
    r.status=r.prevStatus||(r.type==='blei'?'bleiber':'dirty');r.prevStatus=null;
    saveRooms();toast('Aufgehoben Zi. '+r.number);render();return;
  }
  if(ns==='undo-green'){
    r.status=r.prevStatus||'bleiber';r.prevStatus=null;
    saveRooms();toast('Green aufgehoben');render();return;
  }
  if(ns==='rote-karte'||ns==='green-option')r.prevStatus=r.status;
  r.status=ns;
  if(ns==='progress'||ns==='bleiber-prog'){r.tProg=nowT();r.byProg=n;}
  if(ns==='clean'||ns==='bleiber-clean'||ns==='rote-karte'){r.tClean=nowT();r.byClean=n;}
  saveRooms();toast('Zi. '+r.number+' - '+(ST_LBL[ns]||ns));render();
}
function saveNote(id,text){
  for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){rooms[i].note=text.trim();break;}}
  saveRooms();noteId=null;toast('Notiz gespeichert');render();
}
function removeRoom(id){
  if(!confirm('Zimmer entfernen?'))return;
  rooms=rooms.filter(function(r){return r.id!==id;});
  saveRooms();render();
}
function setGreenOption(num){
  for(var i=0;i<rooms.length;i++){
    if(rooms[i].number===num&&(rooms[i].status==='bleiber'||rooms[i].status==='bleiber-prog')){
      rooms[i].prevStatus=rooms[i].status;rooms[i].status='green-option';
      saveRooms();toast('Green Option: Zi. '+num);render();return;
    }
  }
  toast('Zi. '+num+' nicht verfuegbar');
}
function doDepCheckout(num,name){
  for(var i=0;i<rezDepList.length;i++){if(rezDepList[i].num===num)rezDepList[i].checkedOut=true;}
  saveRezDep();
  var active=['dirty','progress','clean','bleiber','bleiber-prog','bleiber-clean','rote-karte','green-option'];
  var found=false;
  for(var j=0;j<rooms.length;j++){if(rooms[j].number===num&&active.indexOf(rooms[j].status)>=0){found=true;break;}}
  if(!found){
    var dep=null;
    for(var k=0;k<rezDepList.length;k++){if(rezDepList[k].num===num){dep=rezDepList[k];break;}}
    var initStatus=(dep&&dep.lateCheckout)?'late-checkout':'dirty';
    var initEarlyCI=!!(dep&&dep.earlyCheckin);
    rooms.push({id:gid(),number:num,status:initStatus,tCreated:nowT(),
      tProg:null,tClean:null,tReady:null,minibar:null,
      byCO:(eu()&&eu().name)||'?',byProg:null,byClean:null,byReady:null,
      note:(dep&&dep.note)||'',type:'co',earlyCheckin:initEarlyCI});
    saveRooms();
  }
  toast('Zi. '+num+' ausgecheckt');depNoteId=null;render();
}
function saveDepNote(num){
  var el=document.getElementById('dep-note-'+num);
  for(var i=0;i<rezDepList.length;i++){if(rezDepList[i].num===num&&el){rezDepList[i].note=el.value.trim();break;}}
  saveRezDep();depNoteId=null;render();
}
function appendDepNote(num,text){
  var el=document.getElementById('dep-note-'+num);
  if(el){el.value=el.value?el.value+', '+text:text;}
}

// ── REPAIR ───────────────────────────────────────────────────
function submitRepair(){
  var catEl=document.getElementById('ort-cat');
  var subEl=document.getElementById('ort-sub');
  var descEl=document.getElementById('rf-desc');
  var prioEl=document.getElementById('rf-prio');
  var noteEl=document.getElementById('rf-imgnote');
  if(catEl)rfData.ortCat=catEl.value;
  if(subEl)rfData.ortSub=subEl.value;
  if(descEl)rfData.desc=descEl.value;
  if(prioEl)rfData.prio=prioEl.value;
  if(noteEl)rfData.imgNote=noteEl.value;
  var ortId=rfData.ortSub||rfData.ortCat;
  if(!ortId){toast('Bitte Ort auswählen');return;}
  // Accept either desc OR imgNote as text
  if(!rfData.desc.trim()&&!rfData.imgNote.trim()){toast('Bitte Beschreibung oder Bemerkung eingeben');return;}
  var now=new Date();
  var dateStr=now.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  var u=eu();
  repairs.push({
    id:gid(),
    ortId:ortId,loc:ortLabel(ortId),
    desc:rfData.desc.trim()||rfData.imgNote.trim(),prio:rfData.prio,
    by:(u&&u.name)||'?',dept:DL[(u&&u.dept)]||'',
    img:rfData.img||null,imgNote:rfData.imgNote||'',
    status:'rp-open',
    date:dateStr,dateRaw:now.toISOString().slice(0,10),
    month:now.toISOString().slice(0,7),
    year:String(now.getFullYear()),
    tCreated:nowT(),
    tAccepted:null,byAccepted:null,tAcceptedFull:null,
    tDone:null,byDone:null,tDoneFull:null,
    tParked:null,parkReason:null,
    minutesWorked:0,
    workLog:[]
  });
  saveRepairs();
  rfData={loc:'',ortCat:'',ortSub:'',desc:'',prio:'sofort',img:null};
  showRF=false;
  toast('Reparatur eingetragen');render();
}
function acceptRepair(id){
  var now=new Date();
  for(var i=0;i<repairs.length;i++){
    if(repairs[i].id===id){
      var r=repairs[i];
      r.status='rp-progress';
      r.byAccepted=(eu()&&eu().name)||'?';
      r.tAccepted=nowT();
      r.tAcceptedFull=now.toISOString();
      r.workLog=r.workLog||[];
      r.workLog.push({action:'start',by:r.byAccepted,t:now.toISOString(),ts:nowT()});
      break;
    }
  }
  saveRepairs();toast('Auftrag angenommen – Uhr läuft');render();
}
function doneRepair(id){
  var now=new Date();
  for(var i=0;i<repairs.length;i++){
    if(repairs[i].id===id){
      var r=repairs[i];
      r.status='rp-done';
      r.byDone=(eu()&&eu().name)||'?';
      r.tDone=nowT();r.tDoneFull=now.toISOString();
      r.workLog=r.workLog||[];
      r.workLog.push({action:'done',by:r.byDone,t:now.toISOString(),ts:nowT()});
      // calc total minutes
      var mins=0;
      var wl=r.workLog;
      for(var w=0;w<wl.length-1;w++){
        if(wl[w].action==='start'||wl[w].action==='resume'){
          var next=wl[w+1];
          if(next){
            var diff=(new Date(next.t)-new Date(wl[w].t))/60000;
            if(diff>0&&diff<480)mins+=Math.round(diff);
          }
        }
      }
      // also count from last start/resume to now if none found
      if(mins===0&&r.tAcceptedFull){
        var d2=(now-new Date(r.tAcceptedFull))/60000;
        if(d2>0&&d2<480)mins=Math.round(d2);
      }
      r.minutesWorked=(r.minutesWorked||0)+mins;
      break;
    }
  }
  saveRepairs();toast('Erledigt - Auftrag abgeschlossen');render();
}
function parkRepair(id,reason){
  var now=new Date();
  for(var i=0;i<repairs.length;i++){
    if(repairs[i].id===id){
      var r=repairs[i];
      r.status='rp-parked';
      r.parkReason=reason||'material';
      r.tParked=nowT();
      r.workLog=r.workLog||[];
      r.workLog.push({action:'parked',reason:reason,by:(eu()&&eu().name)||'?',t:now.toISOString(),ts:nowT()});
      // calc partial time
      var last=null;
      for(var w=r.workLog.length-2;w>=0;w--){
        if(r.workLog[w].action==='start'||r.workLog[w].action==='resume'){last=r.workLog[w];break;}
      }
      if(last){
        var diff=(now-new Date(last.t))/60000;
        if(diff>0&&diff<480)r.minutesWorked=(r.minutesWorked||0)+Math.round(diff);
      }
      break;
    }
  }
  saveRepairs();
  var msg=reason==='material'?'Geparkt – Material wird besorgt':'Geparkt – Freigabe ausstehend';
  toast(msg);render();
}
function resumeRepair(id){
  var now=new Date();
  for(var i=0;i<repairs.length;i++){
    if(repairs[i].id===id){
      var r=repairs[i];
      r.status='rp-progress';
      r.workLog=r.workLog||[];
      r.workLog.push({action:'resume',by:(eu()&&eu().name)||'?',t:now.toISOString(),ts:nowT()});
      break;
    }
  }
  saveRepairs();toast('Auftrag fortgesetzt');render();
}
function delRepair(id){
  if(!confirm('Reparatur loeschen?'))return;
  repairs=repairs.filter(function(r){return r.id!==id;});
  saveRepairs();render();
}

// ── TECHNIK ROOM ACTIONS ─────────────────────────────────────
function technikBlock(id){
  var r=null;for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){r=rooms[i];break;}}
  if(!r)return;
  r.prevStatus=r.status;
  r.status='technik-block';
  r.byTechnik=(eu()&&eu().name)||'?';
  r.tTechnik=nowT();
  saveRooms();toast('Zi. '+r.number+' - Technik blockiert');render();
}
function technikRelease(id){
  var r=null;for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){r=rooms[i];break;}}
  if(!r)return;
  // Always goes back to dirty (needs HK regardless)
  r.status='dirty';
  r.prevStatus=null;
  r.byTechnik=null;r.tTechnik=null;
  r.tProg=null;r.byProg=null;r.tClean=null;r.byClean=null;r.tReady=null;r.byReady=null;
  saveRooms();toast('Zi. '+r.number+' - Freigegeben fuer HK');render();
}
function toggleEarlyCI(num){
  for(var i=0;i<rezDepList.length;i++){
    if(rezDepList[i].num===num){
      rezDepList[i].earlyCheckin=!rezDepList[i].earlyCheckin;
      saveRezDep();render();
      toast(rezDepList[i].earlyCheckin?'Early CI: Zi. '+num+' - Prioritaet!':'Early CI aufgehoben: Zi. '+num);
      // Also update room if already checked out
      for(var j=0;j<rooms.length;j++){
        if(rooms[j].number===num&&['dirty','progress','late-checkout'].indexOf(rooms[j].status)>=0){
          rooms[j].earlyCheckin=rezDepList[i].earlyCheckin;
          saveRooms();break;
        }
      }
      return;
    }
  }
}
function toggleLateCO(num){
  for(var i=0;i<rezDepList.length;i++){
    if(rezDepList[i].num===num){
      rezDepList[i].lateCheckout=!rezDepList[i].lateCheckout;
      saveRezDep();render();
      toast(rezDepList[i].lateCheckout?'Late Checkout: Zi. '+num:'Late Checkout aufgehoben');
      return;
    }
  }
}
function setLateCheckout(id){
  var r=null;for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){r=rooms[i];break;}}
  if(!r)return;
  r.lateCheckout=true;
  r.status='late-checkout';
  saveRooms();toast('Zi. '+r.number+' - Late Checkout');render();
}
function setEarlyCheckin(id){
  var r=null;for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){r=rooms[i];break;}}
  if(!r)return;
  r.earlyCheckin=true;
  if(r.status==='ready'){r.status='dirty';}
  saveRooms();toast('Early Check-in gesetzt: Zi. '+r.number+' - Prioritaet!');render();
}

function removeEarlyCheckin(id){
  var r=null;for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){r=rooms[i];break;}}
  if(!r)return;
  r.earlyCheckin=false;
  saveRooms();toast('Early Check-in aufgehoben: Zi. '+r.number);render();
}

function toggleMB(id,item){
  if(!mbSel[id])mbSel[id]=[];
  var idx=mbSel[id].indexOf(item);
  if(idx>=0)mbSel[id].splice(idx,1);else mbSel[id].push(item);
  render();
}
function doRelease(id){
  var r=null;
  for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){r=rooms[i];break;}}
  if(!r)return;
  var mb=(mbSel[id]&&mbSel[id].length>0)?mbSel[id].join(', '):'';
  r.status='ready';r.tReady=nowT();r.byReady=(eu()&&eu().name)||'?';r.minibar=mb;
  delete mbSel[id];
  saveRooms();toast('Zi. '+r.number+' freigegeben');render();
}

// ── STAFF MGMT ───────────────────────────────────────────────
function addStaffMember(dept,name,pw){
  name=(name||'').trim();if(!name)return;
  pw=(pw||'1234').trim();
  if(!staff[dept])staff[dept]=[];
  if(staffNames(dept).indexOf(name)>=0){toast('Bereits vorhanden');return;}
  staff[dept].push({name:name,pw:pw});saveStaff();toast(name+' hinzugefuegt');render();
}
function removeStaffMember(dept,name){
  if(!confirm('"'+name+'" loeschen?'))return;
  staff[dept]=(staff[dept]||[]).filter(function(s){return(typeof s==='object'?s.name:s)!==name;});
  saveStaff();render();
}
function renameStaffMember(dept,oldName){
  var el=document.getElementById('srn-'+dept+'-'+oldName.replace(/\W/g,'_'));
  if(!el)return;
  var newName=el.value.trim();
  if(!newName||newName===oldName)return;
  if(staffNames(dept).indexOf(newName)>=0){toast('Name existiert bereits');return;}
  var arr=staff[dept]||[];
  for(var i=0;i<arr.length;i++){
    var s=arr[i];
    if((typeof s==='object'?s.name:s)===oldName){
      if(typeof s==='object')arr[i].name=newName;else arr[i]={name:newName,pw:'1234'};
      saveStaff();toast('Umbenannt');render();return;
    }
  }
}
function changeStaffPW(dept,name){
  var el=document.getElementById('spw-'+dept+'-'+name.replace(/\W/g,'_'));
  if(!el)return;
  var newPW=el.value.trim();
  if(!newPW){toast('Passwort eingeben');return;}
  var arr=staff[dept]||[];
  for(var i=0;i<arr.length;i++){
    var s=arr[i];
    if((typeof s==='object'?s.name:s)===name){
      if(typeof s==='object')arr[i].pw=newPW;else arr[i]={name:s,pw:newPW};
      saveStaff();toast('Passwort geaendert');render();return;
    }
  }
}
function addMBItem(){
  var el=document.getElementById('mb-add');if(!el)return;
  var v=el.value.trim();if(!v){toast('Name eingeben');return;}
  if(mbItems.indexOf(v)>=0){toast('Bereits vorhanden');return;}
  mbItems.push(v);saveMB();el.value='';toast(v+' hinzugefuegt');render();
}
function removeMBItem(item){
  if(!confirm('"'+item+'" loeschen?'))return;
  mbItems=mbItems.filter(function(i){return i!==item;});saveMB();render();
}
function renameMBItem(oldItem){
  var el=document.getElementById('mb-rn-'+oldItem.replace(/\W/g,'_'));
  if(!el)return;
  var v=el.value.trim();if(!v||v===oldItem)return;
  var idx=mbItems.indexOf(oldItem);
  if(idx>-1){mbItems[idx]=v;saveMB();toast('Umbenannt');render();}
}
function addExtraBtn(){
  var el=document.getElementById('extra-add');if(!el)return;
  var v=el.value.trim();if(!v){toast('Name eingeben');return;}
  extraBtns.push(v);saveExtras();el.value='';render();
}
function removeExtraBtn(item){
  extraBtns=extraBtns.filter(function(i){return i!==item;});saveExtras();render();
}

function ortLabel(id){
  if(!id)return id||'';
  for(var i=0;i<ORTE.length;i++){
    if(ORTE[i].id===id)return ORTE[i].label;
    var sub=ORTE[i].sub||[];
    for(var j=0;j<sub.length;j++){
      if(sub[j].id===id)return ORTE[i].label+' › '+sub[j].label;
    }
  }
  return id;
}
function ortCatChange(){
  var cat=document.getElementById('ort-cat');
  var sub=document.getElementById('ort-sub');
  if(!cat||!sub)return;
  rfData.ortCat=cat.value;rfData.ortSub='';
  sub.innerHTML='<option value="">Ort genauer wählen...</option>';
  for(var k=0;k<ORTE.length;k++){
    if(ORTE[k].id===cat.value){
      var subs=ORTE[k].sub||[];
      for(var s=0;s<subs.length;s++){
        sub.innerHTML+='<option value="'+subs[s].id+'">'+subs[s].label+'</option>';
      }
    }
  }
}

// ── ÜBERSETZUNG via Claude API ────────────────────────────────
var _translCache={};
function translateText(text, targetLang, elementId){
  if(!text||!text.trim())return;
  var cacheKey=text+'|'+targetLang;
  if(_translCache[cacheKey]){
    var el=document.getElementById(elementId);
    if(el)el.innerHTML=_translCache[cacheKey];
    return;
  }
  var el=document.getElementById(elementId);
  if(el)el.innerHTML='<span style="color:var(--muted);font-size:11px">&#8987; Übersetze...</span>';
  var langNames={de:'Deutsch',en:'Englisch',tr:'Türkisch',ru:'Russisch'};
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:200,
      messages:[{role:'user',content:'Übersetze folgenden Text ins '+langNames[targetLang]+'. Antworte NUR mit der Übersetzung, kein Kommentar: '+text}]
    })
  }).then(function(r){return r.json();}).then(function(d){
    var translated=(d.content&&d.content[0]&&d.content[0].text)||text;
    _translCache[cacheKey]=translated;
    var el2=document.getElementById(elementId);
    if(el2)el2.textContent=translated;
  }).catch(function(){
    var el3=document.getElementById(elementId);
    if(el3)el3.textContent=text;
  });
}

// ── VERTEILUNG ────────────────────────────────────────────────
function calcVerteilung(){
  var hkNames=staffNames('housekeeping');
  var workers=[];
  for(var i=0;i<hkNames.length;i++){
    var sh=getShift(hkNames[i],'housekeeping');
    if(sh&&sh.inTime&&!sh.outTime){
      workers.push({name:hkNames[i],floors:sh.floors||[],rooms:[]});
    }
  }
  if(!workers.length){toast('Keine eingecheckten HK-Mitarbeiter');return;}
  var co=(vRooms.co||[]).map(function(n){return{num:n,type:'co',min:30};});
  var blei=(vRooms.blei||[]).map(function(n){return{num:n,type:'blei',min:15};});
  var all=co.concat(blei);
  if(!all.length){toast('Keine Zimmer - bitte PDF laden');return;}

  // Group rooms by floor, then distribute evenly among workers on that floor
  // Step 1: collect all workers per floor
  var floorWorkers={};
  for(var w=0;w<workers.length;w++){
    var wf=workers[w].floors;
    for(var f=0;f<wf.length;f++){
      var fn=floorOfLabel(wf[f]);
      if(!floorWorkers[fn])floorWorkers[fn]=[];
      floorWorkers[fn].push(w);
    }
  }
  // Step 2: group rooms by floor
  var floorRooms={};
  var notCovered=[];
  for(var j=0;j<all.length;j++){
    var room=all[j];
    var floorNum=getFloorOfRoom(room.num);
    if(floorWorkers[floorNum]&&floorWorkers[floorNum].length>0){
      if(!floorRooms[floorNum])floorRooms[floorNum]=[];
      floorRooms[floorNum].push(room);
    } else {
      notCovered.push(room);
    }
  }
  // Step 3: distribute each floor's rooms evenly (round-robin) among its workers
  var floorKeys=Object.keys(floorRooms);
  for(var fk=0;fk<floorKeys.length;fk++){
    var fl=floorKeys[fk];
    var fRooms=floorRooms[fl];
    var fWorkers=floorWorkers[fl];
    // Sort rooms by number for consistent assignment
    fRooms.sort(function(a,b){return parseInt(a.num)-parseInt(b.num);});
    for(var ri=0;ri<fRooms.length;ri++){
      var workerIdx=fWorkers[ri%fWorkers.length];
      workers[workerIdx].rooms.push(fRooms[ri]);
    }
  }
  var unassigned=notCovered;
  // Save to shifts
  for(var sw=0;sw<workers.length;sw++){
    var wk=workers[sw];
    var key=sk(wk.name,'housekeeping');
    if(shifts[key]){
      shifts[key].assignedRooms=wk.rooms.map(function(r){return r.num;});
    }
  }
  saveShifts();

  var html='';
  for(var p=0;p<workers.length;p++){
    var ww=workers[p];
    var totalMin=0;
    for(var m=0;m<ww.rooms.length;m++)totalMin+=ww.rooms[m].min;
    var h=Math.floor(totalMin/60),mn=totalMin%60;
    html+='<div class="vresult-row"><div class="vr-av">'+ini(ww.name)+'</div><div style="flex:1">';
    html+='<div class="vr-name">'+esc(ww.name)+'</div>';
    html+='<div style="font-size:11px;color:var(--grn);margin-bottom:4px">'+esc((ww.floors||[]).join(' + '))+'</div>';
    html+='<div class="vr-count">'+ww.rooms.length+' Zimmer &middot; '+h+'h '+mn+'min</div>';
    html+='<div class="vr-rooms">';
    for(var rr=0;rr<ww.rooms.length;rr++){
      html+='<span class="vr-room '+(ww.rooms[rr].type==='co'?'co':'blei')+'">'+esc(ww.rooms[rr].num)+'</span>';
    }
    html+='</div></div></div>';
  }
  if(unassigned.length){
    html+='<div style="margin-top:12px;padding:10px;background:var(--redbg);border-radius:10px;font-size:13px;color:var(--red);font-weight:600">&#9888; '+unassigned.length+' Zimmer ohne HK-Zuteilung:</div>';
    html+='<div style="padding:8px 10px;background:var(--redbg);border-radius:0 0 10px 10px;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px">';
    for(var uu=0;uu<unassigned.length;uu++){
      html+='<span style="background:var(--red);color:#fff;border-radius:6px;padding:4px 9px;font-size:13px;font-weight:700">'+esc(unassigned[uu].num)+'</span>';
    }
    html+='<div style="width:100%;font-size:11px;color:var(--red);margin-top:4px">Etage nicht belegt – bitte HK-Mitarbeiter einchecken</div></div>';
  }
  var el=document.getElementById('vresult');
  if(el)el.innerHTML=html||'<div style="color:var(--muted);padding:10px">Kein Ergebnis</div>';
}

// ── PDF PARSER ───────────────────────────────────────────────
function parseLines(pdfLines){
  var result={anreisen:[],imHaus:[],abreisen:[]};
  var section=null;
  for(var i=0;i<pdfLines.length;i++){
    var t=pdfLines[i].text.trim();
    if(!t)continue;
    if(t==='Anreisen'&&t.length<15){section='anreisen';continue;}
    if(t==='Im Haus'&&t.length<15){section='imHaus';continue;}
    if(t==='Abreisen'&&t.length<15){section='abreisen';continue;}
    if(/Berichtszeitraum|REZEPTIONSLISTE|Erstellungsdatum/i.test(t))continue;
    if(!section)continue;
    var m=t.match(/^(\d{1,3})\s+\d{2}\.\d{2}\.\d{4}/);
    if(m){
      var num=m[1];
      var found=false;
      for(var j=0;j<result[section].length;j++){if(result[section][j].num===num){found=true;break;}}
      if(!found){
        var nm=t.match(/^\d{1,3}\s+\d{2}\.\d{2}\.\d{4}\s+\d{2}\.\d{2}\.\d{4}\s+([^\d].*?)\s+\d\s+\d\s+\d/);
        result[section].push({num:num,name:nm?nm[1].trim():'',checkedOut:false,note:''});
      }
    }
  }
  result.anreisen.sort(function(a,b){return parseInt(a.num)-parseInt(b.num);});
  result.imHaus.sort(function(a,b){return parseInt(a.num)-parseInt(b.num);});
  result.abreisen.sort(function(a,b){return parseInt(a.num)-parseInt(b.num);});
  return result;
}

function handlePDF(input){
  var f=input.files[0];if(!f)return;
  vImportErr='';
  toast('PDF wird geladen...');
  if(!window.pdfjsLib){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.crossOrigin='anonymous';
    s.onerror=function(){vImportErr='PDF-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.';render();};
    s.onload=function(){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      extractPDF(f);
    };
    document.head.appendChild(s);
    render();
    return;
  }
  extractPDF(f);
}

function extractPDF(file){
  var reader=new FileReader();
  reader.onload=function(e){
    pdfjsLib.getDocument({data:e.target.result}).promise.then(function(pdf){
      var pagePromises=[];
      for(var p=1;p<=pdf.numPages;p++)pagePromises.push(pdf.getPage(p));
      Promise.all(pagePromises).then(function(pages){
        var contentPromises=pages.map(function(page){
          return page.getTextContent().then(function(content){return{page:page,content:content};});
        });
        return Promise.all(contentPromises);
      }).then(function(results){
        var allLines=[];
        for(var ri=0;ri<results.length;ri++){
          var page=results[ri].page;
          var ph=page.getViewport({scale:1}).height;
          var byY={};
          var items=results[ri].content.items;
          for(var i=0;i<items.length;i++){
            var item=items[i];
            if(!item.str.trim())continue;
            var y=Math.round((ph-item.transform[5])*2)/2;
            var x=Math.round(item.transform[4]);
            if(!byY[y])byY[y]=[];
            byY[y].push({x:x,str:item.str});
          }
          var ys=Object.keys(byY).map(Number).sort(function(a,b){return a-b;});
          for(var yi=0;yi<ys.length;yi++){
            var row=byY[ys[yi]].sort(function(a,b){return a.x-b.x;});
            var text=row.map(function(it){return it.str;}).join(' ').trim();
            if(text)allLines.push({text:text,firstX:row[0].x});
          }
        }
        var parsed=parseLines(allLines);
        if(!parsed.imHaus.length&&!parsed.abreisen.length&&!parsed.anreisen.length){
          vImportErr='Keine Zimmer gefunden.';render();return;
        }
        vParsed=parsed;vImportErr='';
        vRooms.blei=parsed.imHaus.map(function(rx){return rx.num;});
        vRooms.co=parsed.abreisen.map(function(rx){return rx.num;});
        vRooms.stay=parsed.anreisen.map(function(rx){return rx.num;});
        saveVRooms();
        var active=['dirty','progress','clean','bleiber','bleiber-prog','bleiber-clean','rote-karte','green-option'];
        var added=0;
        for(var bi=0;bi<parsed.imHaus.length;bi++){
          var bnum=parsed.imHaus[bi].num;
          var bfound=false;
          for(var bj=0;bj<rooms.length;bj++){if(rooms[bj].number===bnum&&active.indexOf(rooms[bj].status)>=0){bfound=true;break;}}
          if(!bfound){
            rooms.push({id:gid(),number:bnum,status:'bleiber',tCreated:nowT(),
              tProg:null,tClean:null,tReady:null,minibar:null,
              byCO:'Rezeptionsliste',byProg:null,byClean:null,byReady:null,note:'',type:'blei'});
            added++;
          }
        }
        if(added>0)saveRooms();
        var prevCO={};
        for(var ci=0;ci<rezDepList.length;ci++){if(rezDepList[ci].checkedOut)prevCO[rezDepList[ci].num]=true;}
        rezDepList=parsed.abreisen.map(function(rx){return{num:rx.num,name:rx.name,note:'',checkedOut:!!prevCO[rx.num]};});
        saveRezDep();
        toast(parsed.imHaus.length+' Bleiber - '+parsed.abreisen.length+' Abreisen');
        render();
      }).catch(function(err){vImportErr='PDF Fehler: '+err.message;render();});
    }).catch(function(err){vImportErr='PDF Fehler: '+err.message;render();});
  };
  reader.readAsArrayBuffer(file);
}

function renderRoomCard(r){
  var st=r.status;
  var u=eu();
  var actions='',extra='';

  if(canAct('progress')&&st==='dirty')actions+='<button class="btn btn-prog" data-id="'+r.id+'" data-fn="hkProgress" data-action="do-room">In Bearbeitung</button>';
  if(canAct('clean')&&st==='progress')actions+='<button class="btn btn-cln" data-id="'+r.id+'" data-fn="hkClean" data-action="do-room">Gereinigt</button>';
  if(canAct('bleiber_prog')&&st==='bleiber')actions+='<button class="btn btn-teal" data-id="'+r.id+'" data-fn="hkBleiberProg" data-action="do-room">In Bearbeitung</button>';
  if(canAct('bleiber_clean')&&st==='bleiber-prog')actions+='<button class="btn btn-teal" data-id="'+r.id+'" data-fn="hkBleiberClean" data-action="do-room">Gereinigt</button>';

  var noRote=['rote-karte','ready','green-option','bleiber-clean','clean','technik-block','late-checkout'];
  if(canAct('rote_karte')&&noRote.indexOf(st)<0)actions+='<button class="btn btn-rose" data-id="'+r.id+'" data-fn="hkRoteKarte" data-action="do-room">Rote Karte</button>';

  if(canAct('technik_block')&&st!=='technik-block')
    actions+='<button class="btn" style="background:var(--purbg);color:var(--pur);border:1px solid var(--purbor)" data-id="'+r.id+'" data-fn="technikBlock" data-action="do-room">&#128295; Technik blockieren</button>';
  if(canAct('technik_release')&&st==='technik-block')
    actions+='<button class="btn btn-gold" style="width:100%" data-id="'+r.id+'" data-fn="technikRelease" data-action="do-room">Freigeben – HK reinigen</button>';

    actions+='<button class="btn" style="background:var(--orabg);color:var(--ora);border:1px solid var(--orabor)" data-id="'+r.id+'" data-fn="setLateCheckout" data-action="do-room">&#128336; Late Checkout</button>';
  if(canAct('late_co')&&st==='late-checkout')
    actions+='<button class="btn" style="background:var(--orabg);color:var(--ora);border:1px solid var(--orabor)" data-id="'+r.id+'" data-fn="hkLateCOUndo" data-action="do-room">Late Checkout aufheben</button>';
  // Early checkin
  if(canAct('early_ci')&&['dirty','progress','clean','late-checkout','ready'].indexOf(st)>=0&&!r.earlyCheckin)
    actions+='<button class="btn" style="background:var(--blubg);color:var(--blu);border:1px solid var(--blubor)" data-id="'+r.id+'" data-fn="setEarlyCheckin" data-action="do-room">&#9889; Early Check-in</button>';
  if(canAct('early_ci')&&r.earlyCheckin)
    actions+='<button class="btn" style="background:var(--blubg);color:var(--blu);border:1px solid var(--blubor)" data-id="'+r.id+'" data-fn="removeEarlyCheckin" data-action="do-room">Early Check-in aufheben</button>';
  if(canAct('undo_rote')&&st==='rote-karte'){
    var undoLbl=(u&&(u.dept==='housekeeping'||u.dept==='supervisor'))?'Schild weg':'Rote Karte aufheben';
    actions+='<button class="btn btn-gold" style="width:100%" data-id="'+r.id+'" data-fn="hkUndoRote" data-action="do-room">'+undoLbl+'</button>';
  }
  if(canAct('green')&&(st==='bleiber'||st==='dirty'))actions+='<button class="btn" style="background:var(--grnbg);color:var(--grn);border:1px solid var(--grnbor)" data-id="'+r.id+'" data-fn="hkGreen" data-action="do-room">Green Option</button>';
  if(canAct('green')&&st==='green-option')actions+='<button class="btn btn-teal" data-id="'+r.id+'" data-fn="hkUndoGreen" data-action="do-room">Green aufheben</button>';

  var relSt=['clean','bleiber-clean','green-option'];
  if(canAct('release')&&relSt.indexOf(st)>=0){
    if(!mbSel[r.id])mbSel[r.id]=[];
    var sel=mbSel[r.id];
    var snackNames=['Brodericks','Chips','Taste','Jealous','Cookies','Nuts'];
    var snacks=[],drinks=[];
    for(var mi=0;mi<mbItems.length;mi++){
      var isSnack=false;
      for(var si=0;si<snackNames.length;si++){if(mbItems[mi].indexOf(snackNames[si])===0){isSnack=true;break;}}
      if(isSnack)snacks.push(mbItems[mi]);else drinks.push(mbItems[mi]);
    }
    var mbHtml='<div class="mbox"><label>Minibar - was verbraucht?</label>';
    if(snacks.length){
      mbHtml+='<div style="margin-bottom:6px"><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px">Snacks</div><div class="mb-qbtns">';
      for(var sni=0;sni<snacks.length;sni++){mbHtml+='<button class="mb-qbtn'+(sel.indexOf(snacks[sni])>=0?' sel':'')+'" onclick="toggleMB(\''+r.id+'\',\''+esc(snacks[sni])+'\')">'+esc(snacks[sni])+'</button>';}
      mbHtml+='</div></div>';
    }
    if(drinks.length){
      mbHtml+='<div style="margin-bottom:6px"><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px">Drinks</div><div class="mb-qbtns">';
      for(var dri=0;dri<drinks.length;dri++){mbHtml+='<button class="mb-qbtn'+(sel.indexOf(drinks[dri])>=0?' sel':'')+'" onclick="toggleMB(\''+r.id+'\',\''+esc(drinks[dri])+'\')">'+esc(drinks[dri])+'</button>';}
      mbHtml+='</div></div>';
    }
    mbHtml+='<div class="mb-summary">'+(sel.length>0?'Ausgewaehlt: '+sel.join(', '):'Nichts ausgewaehlt')+'</div></div>';
    extra=mbHtml;
    var relLbl=st==='green-option'?'Minibar & Freigeben':'Freigeben';
    actions+='<button class="btn btn-gold" data-id="'+r.id+'" data-fn="doRelease" data-action="do-room">'+relLbl+'</button>';
  }

  if(st==='ready'){
    extra=r.minibar?'<div style="margin-bottom:5px"><span class="mb-tag">'+esc(r.minibar)+'</span></div>':'<div style="margin-bottom:5px"><span class="no-mb-tag">Minibar leer</span></div>';
  }
    if(me&&me.isAdmin&&!persona)actions+='<button class="btn btn-del" style="flex:0;min-width:auto;padding:8px 10px" data-id="'+r.id+'" data-fn="removeRoom" data-action="do-room" >&#128465;</button>';

  var stag='';
  if(st==='green-option'){
    var isSup=canAct('release');
    stag='<div style="background:var(--grnbg);border:2px solid var(--grnbor);border-radius:10px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:8px"><span style="font-size:20px">&#127807;</span><div><div style="font-size:13px;font-weight:700;color:var(--grn)">KEIN SERVICE</div><div style="font-size:11px;color:var(--muted)">'+(isSup?'Minibar pruefen + freigeben':'Gast wuenscht keine Reinigung')+'</div></div></div>';
  }
  if(st==='rote-karte'){
    var isBlei=['bleiber','bleiber-prog','blei'].indexOf(r.prevStatus||r.type||'')>=0;
    stag='<div style="background:var(--rosebg);border:2px solid var(--rosebor);border-radius:10px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:8px"><span style="font-size:22px">&#128308;</span><div style="flex:1"><div style="font-size:14px;font-weight:700;color:var(--rose)">ROTE KARTE</div><div style="font-size:11px;color:var(--muted)">'+(isBlei?'Bleiber':'Checkout')+'</div></div></div>';
  }
  if(st==='bleiber'||st==='bleiber-prog'||st==='bleiber-clean'){stag='<span class="info-tag">Bleiber</span> ';}
  if(st==='technik-block'){stag='<div style="background:var(--purbg);border:2px solid var(--purbor);border-radius:10px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:8px"><span style="font-size:20px">&#128295;</span><div><div style="font-size:13px;font-weight:700;color:var(--pur)">TECHNIK BLOCKIERT</div><div style="font-size:11px;color:var(--muted)">Nach Freigabe: HK reinigen, Supervisor freigeben</div></div></div>';}
  if(st==='late-checkout'){stag='<div style="background:var(--orabg);border:2px solid var(--orabor);border-radius:10px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:8px"><span style="font-size:20px">&#128336;</span><div><div style="font-size:13px;font-weight:700;color:var(--ora)">LATE CHECKOUT</div><div style="font-size:11px;color:var(--muted)">Gast bleibt laenger - HK spaeter informiert</div></div></div>';}
  if(r.earlyCheckin){stag+='<div style="background:var(--blubg);border:2px solid var(--blubor);border-radius:10px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:8px"><span style="font-size:20px">&#9889;</span><div><div style="font-size:13px;font-weight:700;color:var(--blu)">EARLY CHECK-IN – PRIORITAET</div><div style="font-size:11px;color:var(--muted)">Sofort reinigen und freigeben!</div></div></div>';}
  // (duplicate banners removed)

  var canNote=canAct('note');
  var editing=noteId===r.id;
  var noteBlock='';
  if(editing){
    var qkHtml='<div class="nqbtns">';
    for(var qi=0;qi<extraBtns.length;qi++){qkHtml+='<button class="nqbtn" onclick="appendNote(\''+r.id+'\',\''+esc(extraBtns[qi])+'\')">'+esc(extraBtns[qi])+'</button>';}
    qkHtml+='</div>';
    noteBlock='<div style="margin-bottom:6px">'+qkHtml+'<input class="note-inp" id="note-inp-'+r.id+'" type="text" placeholder="Freitext..." maxlength="80"><div style="display:flex;gap:6px;margin-top:5px"><button class="btn btn-gold" style="flex:1;padding:7px" onclick="doSaveNote(\''+r.id+'\')">Speichern</button><button class="btn btn-del" style="flex:0;padding:7px 10px" onclick="noteId=null;render()">X</button></div></div>';
  }else if(r.note){
    noteBlock='<div style="margin-bottom:6px"><span class="note-tag">'+esc(r.note)+'</span>'+(canNote?'<button style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-left:6px" onclick="noteId=\''+r.id+'\';render()">Bearb.</button>':'')+'</div>';
  }else if(canNote&&['ready','green-option','bleiber-clean'].indexOf(st)<0){
    noteBlock='<div style="margin-bottom:5px"><button style="background:none;border:1px dashed rgba(201,168,76,.25);border-radius:6px;color:var(--muted);font-size:11px;cursor:pointer;padding:3px 9px;font-family:inherit" onclick="noteId=\''+r.id+'\';render()">+ Notiz fuer HK</button></div>';
  }

  var tl=[];
  if(r.tCreated)tl.push(r.tCreated+' <span class="by-tag">'+esc(r.byCO||'?')+'</span>');
  if(r.tProg)tl.push('&#9654; '+r.tProg+' <span class="by-tag">'+esc(r.byProg||'?')+'</span>');
  if(r.tClean)tl.push('&#10003; '+r.tClean+' <span class="by-tag">'+esc(r.byClean||'?')+'</span>');
  if(r.tReady)tl.push('&#11088; '+r.tReady+' <span class="by-tag">'+esc(r.byReady||'?')+'</span>');

  var html='<div class="rmc '+st+'">';
  html+='<div class="rmtop"><div class="rmnum">'+esc(r.number)+'</div><span class="pill '+st+'">'+(ST_LBL[st]||st)+'</span></div>';
  html+=stag+extra+noteBlock;
  if(tl.length)html+='<div class="tl-row">'+tl.join(' &middot; ')+'</div>';
  if(actions)html+='<div class="arow">'+actions+'</div>';
  html+='</div>';
  return html;
}

      +'<img id="rf-prev" class="imgprev">'

      +'</div>';
    form+='<div class="fbtns"><button class="bsubmit" onclick="submitRepair()">'+t('submit')+'</button><button class="bcancel" onclick="showRF=false;rfData={loc:\'\',ortCat:\'\',ortSub:\'\',desc:\'\',prio:\'sofort\',img:null,imgNote:\'\'};render()">'+t('cancel')+'</button></div></div>';

      var noteElId='imgnote-'+r.id;
      cards+='<div style="background:var(--navy);border-radius:8px;padding:8px 11px;margin:6px 0;border-left:3px solid var(--gold)">';

      cards+='<button onclick="translateText('+JSON.stringify(r.imgNote)+',\'ru\',\''+noteElId+'\')" style="padding:3px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:transparent;font-size:15px;cursor:pointer">&#127479;&#127482;</button>';

  var parkCnt=repairs.filter(function(x){return x.status==='rp-parked';}).length;
  var doneCnt=repairs.filter(function(x){return x.status==='rp-done';}).length;
  var filterBar='<div class="ftabs">'
    +'<button class="ftab'+(rpF==='all'?' on':'')+'" onclick="setRpF(this)" data-f="all">Alle</button>'

    +'</div>';
  // Statistik
  var statsHtml='';
  if(rpF==='stats'){
    var statsData={};
    var done=repairs.filter(function(x){return x.status==='rp-done';});
    // Group by period
    var statPeriod=window._statPeriod||'month';
    for(var si=0;si<done.length;si++){
      var rep=done[si];
      var key=statPeriod==='day'?rep.date:(statPeriod==='month'?rep.month:rep.year);
      if(!key)continue;
      if(!statsData[key])statsData[key]={count:0,minutes:0,locs:{}};
      statsData[key].count++;
      statsData[key].minutes+=(rep.minutesWorked||0);
      var loc=ortLabel(rep.ortId||'')||rep.loc||'?';
      statsData[key].locs[loc]=(statsData[key].locs[loc]||0)+1;
    }
    var periods=['day','month','year'];
    var periodLbls={day:'Tag',month:'Monat',year:'Jahr'};
    statsHtml='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
    statsHtml+='<div style="display:flex;gap:8px;margin-bottom:14px">';
    for(var pi=0;pi<periods.length;pi++){
      statsHtml+='<button onclick="window._statPeriod=\''+periods[pi]+'\';render()" style="flex:1;padding:9px;border-radius:8px;border:1px solid '+(statPeriod===periods[pi]?'var(--gold)':'rgba(255,255,255,.1)')+';background:'+(statPeriod===periods[pi]?'var(--gdim)':'transparent')+';color:'+(statPeriod===periods[pi]?'var(--gold)':'var(--muted)')+';font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">'+periodLbls[periods[pi]]+'</button>';
    }
    statsHtml+='</div>';
    var keys=Object.keys(statsData).sort().reverse();
    if(!keys.length){statsHtml+='<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Noch keine erledigten Aufträge</div>';}
    for(var ki=0;ki<keys.length;ki++){
      var kd=statsData[keys[ki]];
      var kh=Math.floor(kd.minutes/60),km=kd.minutes%60;
      statsHtml+='<div style="border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:8px">';
      statsHtml+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
      statsHtml+='<div style="font-weight:700;font-size:15px;color:var(--white)">'+esc(keys[ki])+'</div>';
      statsHtml+='<div style="text-align:right"><div style="font-size:13px;color:var(--gold);font-weight:600">'+kd.count+' Aufträge</div>';
      statsHtml+='<div style="font-size:11px;color:var(--grn)">&#9201; '+(kh>0?kh+'h ':'')+km+'min</div></div></div>';
      // Top locations
      var locArr=Object.keys(kd.locs).map(function(l){return {loc:l,cnt:kd.locs[l]};}).sort(function(a,b){return b.cnt-a.cnt;});
      statsHtml+='<div style="font-size:11px;color:var(--muted);margin-bottom:5px">Häufigste Orte:</div>';
      statsHtml+='<div style="display:flex;flex-wrap:wrap;gap:5px">';
      for(var li2=0;li2<Math.min(locArr.length,6);li2++){
        statsHtml+='<span style="background:var(--navy);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--white)">'+esc(locArr[li2].loc)+' ('+locArr[li2].cnt+')</span>';
      }
      statsHtml+='</div></div>';
    }
    statsHtml+='</div>';
  }
  var langFlags2={de:'🇩🇪',en:'🇬🇧',tr:'🇹🇷',ru:'🇷🇺'};
  var newBtn=showRF?'':'<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn btn-rep" style="flex:1;padding:13px" onclick="showRF=true;render()">'+t('new_btn')+'</button>'+'<button onclick="setLang(this)" data-lang="de" style="padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;font-size:18px;cursor:pointer">🇩🇪</button><button onclick="setLang(this)" data-lang="en" style="padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;font-size:18px;cursor:pointer">🇬🇧</button><button onclick="setLang(this)" data-lang="tr" style="padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;font-size:18px;cursor:pointer">🇹🇷</button><button onclick="setLang(this)" data-lang="ru" style="padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;font-size:18px;cursor:pointer">🇷🇺</button></div>';
  return newBtn+form+filterBar+(rpF==='stats'?statsHtml:cards);
}

// ── VERTEILUNG TAB ───────────────────────────────────────────
function renderVerteilungTab(){
  var hkNames=staffNames('housekeeping');
  var checkedIn=[],notIn=[];
  for(var i=0;i<hkNames.length;i++){
    var sh=getShift(hkNames[i],'housekeeping');
    if(sh&&sh.inTime&&!sh.outTime)checkedIn.push({name:hkNames[i],floors:sh.floors||[],rooms:(sh.assignedRooms||[])});
    else notIn.push(hkNames[i]);
  }
  var staffRows='';
  for(var c=0;c<checkedIn.length;c++){
    var w=checkedIn[c];
    staffRows+='<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--grnbg);border:1px solid var(--grnbor);border-radius:10px;margin-bottom:8px">';
    staffRows+='<div class="av" style="background:var(--grnbg);color:var(--grn)">'+ini(w.name)+'</div>';
    staffRows+='<div style="flex:1"><div style="font-weight:600;font-size:14px">'+esc(w.name)+'</div>';
    staffRows+='<div style="font-size:12px;color:var(--grn)">'+esc((w.floors||[]).join(' + ')||'Keine Etagen')+'</div>';
    if(w.rooms&&w.rooms.length)staffRows+='<div style="font-size:11px;color:var(--muted)">'+w.rooms.length+' Zimmer zugeteilt</div>';
    staffRows+='</div><span class="spill sp-on">Aktiv</span></div>';
  }
  if(notIn.length)staffRows+='<div style="font-size:12px;color:var(--muted);margin-top:8px">Nicht eingecheckt: '+notIn.map(esc).join(', ')+'</div>';
  if(!checkedIn.length)staffRows='<div style="color:var(--muted);font-size:13px;padding:10px">Noch niemand eingecheckt</div>';
  var loaded=vRooms.blei&&vRooms.blei.length>0;
  var listHtml='';
  if(loaded){
    listHtml+='<div class="vbox" style="margin-top:0">';
    listHtml+='<div style="display:flex;gap:8px;margin-bottom:10px">';
    listHtml+='<div style="flex:1;background:var(--redbg);border:1px solid var(--redbor);border-radius:10px;padding:10px">';
    listHtml+='<div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:6px">Abreisen ('+vRooms.co.length+')</div>';
    listHtml+='<div style="display:flex;flex-wrap:wrap;gap:5px">';
    for(var vi=0;vi<vRooms.co.length;vi++){
      listHtml+='<span style="background:var(--red);color:#fff;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700">'+esc(vRooms.co[vi])+'</span>';
    }
    listHtml+='</div></div>';
    listHtml+='<div style="flex:1;background:var(--tealbg);border:1px solid var(--tealbor);border-radius:10px;padding:10px">';
    listHtml+='<div style="font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;margin-bottom:6px">Im Haus ('+vRooms.blei.length+')</div>';
    listHtml+='<div style="display:flex;flex-wrap:wrap;gap:5px">';
    for(var vj=0;vj<vRooms.blei.length;vj++){
      listHtml+='<span style="background:var(--teal);color:#fff;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700">'+esc(vRooms.blei[vj])+'</span>';
    }
    listHtml+='</div></div></div></div>';
  }
  return '<div class="vbox"><h3>Eingecheckte HK-Mitarbeiter</h3>'+staffRows+'</div>'
    +'<div class="vbox"><h3>Rezeptionsliste</h3>'
    +(loaded?'<div style="font-size:12px;color:var(--grn);margin-bottom:10px">&#128994; '+(vRooms.blei||[]).length+' Bleiber &middot; '+(vRooms.co||[]).length+' Abreisen geladen</div>':'')
    +'<label class="vupload" for="v-pdf">'+(loaded?'PDF erneut laden':'PDF laden (Hotelmeister)')
    +(loaded?'':'<span style="margin-left:auto;font-size:11px;opacity:.6">morgens laden</span>')
    +'</label><input type="file" id="v-pdf" accept=".pdf" style="display:none" onchange="handlePDF(this)">'
    +(vImportErr?'<div style="color:var(--red);font-size:12px;padding:6px 0">'+esc(vImportErr)+'</div>':'')
    +(loaded?'<button class="btn btn-gold" style="width:100%;padding:13px;margin-top:8px" onclick="calcVerteilung()">Verteilung berechnen</button>':'')
    +'</div>'
    +listHtml
    +'<div class="vresult" id="vresult"></div>';
}

function handleRepImg(input){
  var f=input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var max=800,sc=img.width>max?max/img.width:1;
      canvas.width=img.width*sc;canvas.height=img.height*sc;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      rfData.img=canvas.toDataURL('image/jpeg',0.72);
      var pv=document.getElementById('rf-prev');if(pv){pv.src=rfData.img;pv.style.display='block';}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

// ── BOOT ──────────────────────────────────────────────────────
function boot(){
  console.log('=== Bellman Ops v3.1 booting ===');
  // Show version
  setTimeout(function(){toast('v3.1 geladen – tippe irgendwo');}, 1000);
  // Global click handler for tab buttons - catches ALL tab clicks reliably
  // MASTER EVENT DELEGATION - handles ALL interactions
  document.addEventListener('click', function(e){
    var el = e.target;
    // Walk up to find actionable element
    var depth = 0;
    while(el && el !== document.body && depth < 5){
      var action = el.getAttribute ? el.getAttribute('data-action') : null;
      var k = el.getAttribute ? el.getAttribute('data-k') : null;
      
      // Tab switching
      if(el.className && typeof el.className === 'string' && el.className.indexOf('mtab') >= 0 && k){
        console.log('TAB CLICK:', k);
        switchTab(k);
        return;
      }
      
      // Data actions
      if(action){
        console.log('ACTION:', action, el.getAttribute('data-room'), el.getAttribute('data-task'));
        if(action==='si-accept'){ siAccept(); return; }
        if(action==='si-complete'){ siComplete(); return; }
        if(action==='si-reset'){ siReset(); return; }
        if(action==='si-room'){ siDoRoom(el); return; }
        if(action==='si-kueche'){ siToggleKueche(el.getAttribute('data-room')); return; }
        if(action==='si-menge'){ siDoMenge(el); return; }
        if(action==='cl-accept'){ clAccept(); return; }
        if(action==='cl-complete'){ clComplete(); return; }
        if(action==='cl-toggle'){ clDoToggle(el); return; }
        if(action==='set-lang'){ setLang(el); return; }
        if(action==='set-period'){ setPeriod(el); return; }
        if(action==='set-rp-period'){ setRpPeriod(el); return; }
        if(action==='set-rpf'){ setRpF(el); return; }
        if(action==='set-statp'){ setStatP(el); return; }
        if(action==='do-room'){ doRoomBtn(el); return; }
        return;
      }
      
      el = el.parentElement;
      depth++;
    }
  });
  
  // Input change delegation for silikon menge
  document.addEventListener('change', function(e){
    var el = e.target;
    if(el.getAttribute && el.getAttribute('data-action')==='si-menge'){
      siDoMenge(el);
    }
  });;
  // Migrate from old prefix
  try{
    var oldR=localStorage.getItem('b8_rooms');
    var newR=localStorage.getItem('b9_rooms');
    if(oldR&&!newR){
      ['rooms','repairs','shifts','staff','mbItems','rezDep','extras','vRooms','today'].forEach(function(k){
        var v=localStorage.getItem('b8_'+k);
        if(v)localStorage.setItem('b9_'+k,v);
      });
    }
  }catch(e){}

  // Daily reset - keep technik-block rooms
  var today=new Date().toDateString();
  var wasReset=lget('today','')!==today;
  if(wasReset){
    lset('today',today);
    var prevRooms=toArr(lget('rooms',[]));
    var keepRooms=prevRooms.filter(function(r){return r.status==='technik-block';});
    lset('rooms',keepRooms);
    lset('rezDep',[]);
    lset('vRooms',{co:[],blei:[],stay:[]});
    lset('resetDate',today);
  }

  // Load data
  rooms=toArr(lget('rooms',[]));
  repairs=toArr(lget('repairs',[]));
  shifts=lget('shifts',{});
  staff=lget('staff',DEFAULT_STAFF);
  mbItems=lget('mbItems',DEFAULT_MB);
  rezDepList=toArr(lget('rezDep',[]));
  extraBtns=lget('extras',DEFAULT_EXTRAS.slice());
  var vr=lget('vRooms',null);
  if(vr){vRooms.co=vr.co||[];vRooms.blei=vr.blei||[];vRooms.stay=vr.stay||[];}

  // Session
  loadMe();
  screen=me?'main':'select';
  if(me)tab=(me.dept==='technik'?'repair':'hk');
  render();

  // Firebase (non-blocking)
  setTimeout(function(){
    var s1=document.createElement('script');
    s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
    s1.crossOrigin='anonymous';
    s1.onerror=function(){console.warn('Firebase app SDK failed');};
    s1.onload=function(){
      var s2=document.createElement('script');
      s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
      s2.crossOrigin='anonymous';
      s2.onerror=function(){console.warn('Firebase db SDK failed');};
      s2.onload=function(){
        try{
          if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
          db=firebase.database();
          // Listeners only - never push local data over Firebase
          // Push reset to Firebase if it happened today (clears other devices too)
          if(wasReset){
            db.ref('b9/rooms').set(rooms).catch(function(){});
            db.ref('b9/rezDep').set([]).catch(function(){});
            db.ref('b9/vRooms').set({co:[],blei:[],stay:[]}).catch(function(){});
            db.ref('b9/resetDate').set(new Date().toDateString()).catch(function(){});
          }
          // Rooms listener: only accept if Firebase resetDate matches today
          db.ref('b9/resetDate').once('value').then(function(snap){
            var fbResetDate=snap.val();
            var todayStr=new Date().toDateString();
            if(fbResetDate!==todayStr&&!wasReset){
              // Firebase has old day's data - push our reset
              db.ref('b9/rooms').set(rooms).catch(function(){});
              db.ref('b9/rezDep').set([]).catch(function(){});
              db.ref('b9/resetDate').set(todayStr).catch(function(){});
            }
            // Now listen for rooms
            db.ref('b9/rooms').on('value',function(s){
              try{
                var v=toArr(s.val());
                if(v.length>0){rooms=v;lset('rooms',v);render();}
              }catch(e){}
            });
          }).catch(function(){
            // If resetDate check fails, just listen normally
            db.ref('b9/rooms').on('value',function(s){
              try{var v=toArr(s.val());if(v.length>0){rooms=v;lset('rooms',v);render();}}catch(e){}
            });
          });
          db.ref('b9/repairs').on('value',function(s){try{var v=toArr(s.val());if(v.length>=0){repairs=v;lset('repairs',v);render();}}catch(e){}});
          db.ref('b9/shifts').on('value',function(s){try{if(s.val()){shifts=s.val();lset('shifts',shifts);render();}}catch(e){}});
          db.ref('b9/staff').on('value',function(s){try{if(s.val()){staff=s.val();lset('staff',staff);render();}}catch(e){}});
          db.ref('b9/mbItems').on('value',function(s){try{var v=s.val();if(Array.isArray(v)&&v.length>0){mbItems=v;lset('mbItems',v);render();}}catch(e){}});
          db.ref('b9/rezDep').on('value',function(s){try{var v=toArr(s.val());rezDepList=v;lset('rezDep',v);render();}catch(e){}});
          db.ref('b9/vRooms').on('value',function(s){try{if(s.val()){Object.assign(vRooms,s.val());lset('vRooms',vRooms);render();}}catch(e){}});
          db.ref('b9/extras').on('value',function(s){try{if(Array.isArray(s.val())){extraBtns=s.val();lset('extras',extraBtns);render();}}catch(e){}});
          // Checkliste live sync
          // Silikon checkliste live sync
          db.ref('b9/silikon_checkliste').on('value',function(s){
  try{
    var sv=s.val();
    if(sv&&sv.status){
      var ord={'si-open':0,'si-accepted':1,'si-done':2};
      var localLvl=ord[siData.status]||0;
      var remoteLvl=ord[sv.status]||0;
      if(remoteLvl>=localLvl){siData=sv;lset(SILIKON_KEY,siData);render();}
    }
  }catch(e){}
});
          var clDateKey='b9/'+clKey();
          db.ref(clDateKey).on('value',function(s){try{if(s.val()&&s.val().status){clData=s.val();lset(clKey(),clData);render();}}catch(e){}});
          var banner=document.getElementById('sync-banner');
          if(banner){
            banner.textContent='Sync aktiv';
            banner.style.cssText='display:flex;position:fixed;top:0;left:0;right:0;z-index:9999;padding:8px;font-size:13px;font-weight:700;justify-content:center;background:rgba(58,184,122,.9);color:#fff;';
            setTimeout(function(){banner.style.display='none';},3000);
          }
        }catch(e){console.warn('Firebase init:',e.message);}
      };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  },500);
}
