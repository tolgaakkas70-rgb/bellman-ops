        } else {
          html+='<div style="flex-shrink:0;width:26px;height:26px;border-radius:7px;border:2px solid '+(done?'var(--grn)':'rgba(255,255,255,.2)')+';background:'+(done?'var(--grn)':'transparent')+';color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:1px">'+(done?'&#10003;':'')+'</div>';
        }
        html+='<div style="flex:1">';
        html+='<div style="font-size:13px;color:'+(done?'var(--muted)':'var(--white)')+';'+(done?'text-decoration:line-through':'')+'">' +esc(txt)+pflichtBadge+'</div>';
        if(entry)html+='<div style="font-size:10px;color:var(--grn);margin-top:3px">&#10003; '+esc(entry.by)+' - '+esc(entry.t)+'</div>';
        html+='</div></div>';
      }
      html+='</div>';
    }
  }
  return html;
}

// ── REPORTING DASHBOARD ──────────────────────────────────────
function renderReportTab(){
  var now=new Date();
  var todayStr=now.toISOString().slice(0,10);
  var thisMonth=now.toISOString().slice(0,7);
  var thisYear=String(now.getFullYear());
  var thisQ='Q'+Math.ceil((now.getMonth()+1)/3)+' '+thisYear;

  // Period filter state
  if(!window._rpPeriod)window._rpPeriod='today';
  var period=window._rpPeriod;

  // Filter repairs by period
  function filterByPeriod(arr){
    return arr.filter(function(r){
      if(period==='today')return r.dateRaw===todayStr;
      if(period==='month')return r.month===thisMonth;
      if(period==='quarter'){
        var q=r.year&&r.month?'Q'+Math.ceil(parseInt(r.month.slice(5))/3)+' '+r.year:'';
        return q===thisQ;
      }
      if(period==='year')return r.year===thisYear;
      return true;
    });
  }

  var allFiltered=filterByPeriod(repairs);
  var done=allFiltered.filter(function(r){return r.status==='rp-done';});
  var open=allFiltered.filter(function(r){return r.status==='rp-open';});
  var prog=allFiltered.filter(function(r){return r.status==='rp-progress';});
  var park=allFiltered.filter(function(r){return r.status==='rp-parked';});
  var totalMin=done.reduce(function(s,r){return s+(r.minutesWorked||0);},0);
  var avgMin=done.length?Math.round(totalMin/done.length):0;

  // Period labels
  var pLabels={today:'Heute ('+todayStr+')',month:'Monat ('+thisMonth+')',quarter:thisQ,year:'Jahr '+thisYear,all:'Gesamt'};

  // ── PERIOD SELECTOR ──
  var html='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
  html+='<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Zeitraum</div>';
  html+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
  ['today','month','quarter','year','all'].forEach(function(p){
    var lbl={today:'Heute',month:'Monat',quarter:'Quartal',year:'Jahr',all:'Gesamt'}[p];
    var sel=period===p;
    html+='<button onclick="window._rpPeriod=\''+p+'\';render()" style="padding:8px 14px;border-radius:8px;border:1px solid '+(sel?'var(--gold)':'rgba(255,255,255,.12)')+';background:'+(sel?'var(--gdim)':'transparent')+';color:'+(sel?'var(--gold)':'var(--muted)')+';font-size:13px;font-weight:'+(sel?'700':'400')+';cursor:pointer;font-family:inherit">'+lbl+'</button>';
  });
  html+='</div>';
  html+='<div style="font-size:12px;color:var(--muted);margin-top:8px">'+pLabels[period]+'</div>';
  html+='</div>';

  // ── KPI KACHELN ──
  function kpi(icon,val,lbl,col){
    return '<div style="flex:1;min-width:130px;background:var(--navy2);border-radius:12px;padding:14px;border-left:3px solid '+col+'">'
      +'<div style="font-size:26px;font-weight:800;color:'+col+'">'+val+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:2px">'+icon+' '+lbl+'</div>'
      +'</div>';
  }
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
  html+=kpi('&#10003;',done.length,'Erledigt','var(--grn)');
  html+=kpi('&#9654;',prog.length,'In Arbeit','var(--blu)');
  html+=kpi('&#128308;',open.length,'Offen','var(--red)');
  html+=kpi('&#128230;',park.length,'Geparkt','var(--ora)');
  html+='</div>';

  // ── ZEIT KPIs ──
  var th=Math.floor(totalMin/60),tm=totalMin%60;
  var ah=Math.floor(avgMin/60),am=avgMin%60;
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
  html+=kpi('&#9201;',(th>0?th+'h ':'')+tm+'min','Gesamtarbeitszeit','var(--teal)');
  html+=kpi('&#8960;',(ah>0?ah+'h ':'')+am+'min','Ø pro Auftrag','var(--pur)');
  html+=kpi('&#128197;',allFiltered.length,'Aufträge gesamt','var(--gold)');
  html+='</div>';

  // ── DRINGLICHKEIT BREAKDOWN ──
  var prioMap={sofort:{l:'SOFORT',c:'var(--red)'},heute:{l:'Heute',c:'var(--ora)'},
               woche:{l:'Diese Woche',c:'var(--grn)'},geplant:{l:'Geplant',c:'var(--muted)'},
               high:{l:'Hoch',c:'var(--red)'},medium:{l:'Mittel',c:'var(--ora)'},low:{l:'Niedrig',c:'var(--grn)'}};
  var prioCounts={};
  allFiltered.forEach(function(r){prioCounts[r.prio]=(prioCounts[r.prio]||0)+1;});
  if(Object.keys(prioCounts).length){
    html+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
    html+='<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px">Dringlichkeit</div>';
    Object.keys(prioCounts).forEach(function(p){
      var pm=prioMap[p]||{l:p,c:'var(--muted)'};
      var pct=Math.round(prioCounts[p]/allFiltered.length*100);
      html+='<div style="margin-bottom:8px">';
      html+='<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:'+pm.c+';font-weight:600">'+pm.l+'</span><span style="color:var(--muted)">'+prioCounts[p]+' ('+pct+'%)</span></div>';
      html+='<div style="height:6px;background:rgba(255,255,255,.08);border-radius:3px"><div style="height:6px;background:'+pm.c+';border-radius:3px;width:'+pct+'%"></div></div>';
      html+='</div>';
    });
    html+='</div>';
  }

  // ── TOP PROBLEMORTE ──
  var locMap={};
  allFiltered.forEach(function(r){
    var loc=ortLabel(r.ortId||'')||r.loc||'?';
    locMap[loc]=(locMap[loc]||0)+1;
  });
  var locArr=Object.keys(locMap).map(function(l){return {loc:l,cnt:locMap[l]};})
    .sort(function(a,b){return b.cnt-a.cnt;}).slice(0,8);
  if(locArr.length){
    html+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
    html+='<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px">&#128205; Häufigste Problemorte</div>';
    var maxCnt=locArr[0].cnt;
    locArr.forEach(function(l){
      var pct=Math.round(l.cnt/maxCnt*100);
      html+='<div style="margin-bottom:8px">';
      html+='<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:var(--white)">'+esc(l.loc)+'</span><span style="color:var(--gold);font-weight:700">'+l.cnt+'x</span></div>';
      html+='<div style="height:5px;background:rgba(255,255,255,.08);border-radius:3px"><div style="height:5px;background:var(--gold);border-radius:3px;width:'+pct+'%"></div></div>';
      html+='</div>';
    });
    html+='</div>';
  }

  // ── TECHNIKER PERFORMANCE ──
  var techMap={};
  done.forEach(function(r){
    var n=r.byDone||r.byAccepted||r.by||'?';
    if(!techMap[n])techMap[n]={done:0,minutes:0};
    techMap[n].done++;techMap[n].minutes+=(r.minutesWorked||0);
  });
  var techArr=Object.keys(techMap).map(function(n){return {name:n,done:techMap[n].done,minutes:techMap[n].minutes};})
    .sort(function(a,b){return b.done-a.done;});
  if(techArr.length){
    html+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
    html+='<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px">&#128296; Techniker Performance</div>';
    techArr.forEach(function(tech){
      var th2=Math.floor(tech.minutes/60),tm2=tech.minutes%60;
      html+='<div style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;background:var(--navy);margin-bottom:6px">';
      html+='<div style="width:36px;height:36px;border-radius:50%;background:var(--purbg);color:var(--pur);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0">'+ini(tech.name)+'</div>';
      html+='<div style="flex:1"><div style="font-weight:600;font-size:13px">'+esc(tech.name)+'</div>';
      html+='<div style="font-size:11px;color:var(--muted)">'+tech.done+' erledigt &middot; '+(th2>0?th2+'h ':'')+tm2+'min gesamt</div></div>';
      html+='<div style="text-align:right"><div style="font-size:16px;font-weight:800;color:var(--grn)">'+tech.done+'</div><div style="font-size:10px;color:var(--muted)">Aufträge</div></div>';
      html+='</div>';
    });
    html+='</div>';
  }

  // ── OFFENE AUFTRÄGE DETAIL ──
  var stillOpen=repairs.filter(function(r){return r.status==='rp-open'||r.status==='rp-progress'||r.status==='rp-parked';});
  if(stillOpen.length){
    html+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
    html+='<div style="font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:10px">&#9888; Ausstehende Aufträge (gesamt: '+stillOpen.length+')</div>';
    var stLblR={'rp-open':'Offen','rp-progress':'In Arbeit','rp-parked':'Geparkt'};
    var stColR={'rp-open':'var(--red)','rp-progress':'var(--blu)','rp-parked':'var(--ora)'};
    stillOpen.slice(0,15).forEach(function(r){
      html+='<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)">';
      html+='<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--white)">'+esc(ortLabel(r.ortId||'')||r.loc||'?')+'</div>';
      html+='<div style="font-size:11px;color:var(--muted);margin-top:2px">'+esc(r.desc.slice(0,60))+(r.desc.length>60?'...':'')+'</div>';
      html+='<div style="font-size:10px;color:var(--muted);margin-top:2px">'+esc(r.date||'')+' – '+esc(r.by||'?')+'</div></div>';
      html+='<span style="flex-shrink:0;font-size:11px;font-weight:700;color:'+stColR[r.status]+';white-space:nowrap">'+stLblR[r.status]+'</span>';
      html+='</div>';
    });
    if(stillOpen.length>15)html+='<div style="font-size:11px;color:var(--muted);margin-top:6px">... und '+( stillOpen.length-15)+' weitere</div>';
    html+='</div>';
  }

  // ── VERLAUF (letzte 30 erledigte) ──
  var recentDone=repairs.filter(function(r){return r.status==='rp-done';}).slice(-30).reverse();
  if(recentDone.length){
    html+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
    html+='<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px">&#128203; Zuletzt erledigt</div>';
    recentDone.slice(0,10).forEach(function(r){
      var wh=Math.floor((r.minutesWorked||0)/60),wm=(r.minutesWorked||0)%60;
      html+='<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)">';
      html+='<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--white)">'+esc(ortLabel(r.ortId||'')||r.loc||'?')+'</div>';
      html+='<div style="font-size:11px;color:var(--muted);margin-top:2px">'+esc(r.desc.slice(0,55))+(r.desc.length>55?'...':'')+'</div>';
      html+='<div style="font-size:10px;color:var(--muted);margin-top:2px">'+esc(r.date||'')+' – '+esc(r.byDone||r.by||'?')+'</div></div>';
      if(r.minutesWorked)html+='<span style="flex-shrink:0;font-size:11px;color:var(--grn);font-weight:600">'+(wh>0?wh+'h ':'')+wm+'min</span>';
      html+='</div>';
    });
    html+='</div>';
  }

  return html;
}

      headerHtml+='<button data-action="si-accept" style="width:100%;padding:13px;border:none;border-radius:10px;background:var(--gold);color:#0d1b2e;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">&#9654; Checkliste annehmen &amp; starten</button>';

    headerHtml+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    headerHtml+='<div><div style="font-size:13px;font-weight:700;color:var(--blu)">&#9654; IN BEARBEITUNG</div>';
    headerHtml+='<div style="font-size:11px;color:var(--muted)">'+esc(siData.acceptedBy||'?')+' – '+esc(siData.tAccepted||'?')+'</div></div>';
    headerHtml+='<div style="text-align:right;font-size:16px;font-weight:800;color:'+(prog.pct===100?'var(--grn)':'var(--gold)')+'">'+prog.pct+'%</div>';

        var checked=!!rd2[task];
        if(canEdit){
          html+='<div style="display:flex;justify-content:center"><button data-room="'+room+'" data-task="'+task+'" data-action="si-room" style="width:28px;height:28px;border-radius:7px;border:2px solid '+(checked?'var(--grn)':'rgba(255,255,255,.25)')+';background:'+(checked?'var(--grn)':'transparent')+';color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center">'+(checked?'&#10003;':'')+'</button></div>';
        } else {
          html+='<div style="display:flex;justify-content:center"><div style="width:28px;height:28px;border-radius:7px;border:2px solid '+(checked?'var(--grn)':'rgba(255,255,255,.15)')+';background:'+(checked?'var(--grn)':'transparent')+';color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center">'+(checked?'&#10003;':'')+'</div></div>';
        }
      }
      
      // Silikon amount input
      var menge=rd2.silikonMenge||'';
      if(canEdit){
        html+='<input type="number" step="0.5" min="0" data-room2="'+room+'" value="'+esc(menge)+'" data-action="si-menge" style="width:100%;padding:4px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:var(--navy);color:var(--white);font-size:12px;text-align:center;font-family:inherit" placeholder="0">';
      } else {
        html+='<div style="text-align:center;font-size:12px;color:'+(menge?'var(--gold)':'var(--muted)')+'">'+esc(menge||'-')+'</div>';
      }
      
      html+='</div>';

      // Kitchen checkbox if checked
      if(rd2.kueche){
        var kwDone=!!rd2.kueche_wb;
        html+='<div style="display:grid;grid-template-columns:48px 1fr;gap:4px;padding:4px 4px 6px 4px;background:rgba(42,184,168,.06);border-radius:6px;margin:2px 0;align-items:center">';
        html+='<div style="font-size:9px;color:var(--teal);text-align:right;padding-right:4px">&#127849;</div>';
        if(canEdit){
          html+='<button data-room="'+room+'" data-task="kueche_wb" data-action="si-room" style="display:flex;align-items:center;gap:6px;background:transparent;border:none;cursor:pointer;padding:0;color:var(--teal);font-size:11px;font-family:inherit"><div style="width:22px;height:22px;border-radius:6px;border:2px solid '+(kwDone?'var(--teal)':'rgba(42,184,168,.4)')+';background:'+(kwDone?'var(--teal)':'transparent')+';color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(kwDone?'&#10003;':'')+'</div>Kuechen-Waschbecken</button>';
        } else {
          html+='<div style="display:flex;align-items:center;gap:6px;color:var(--teal);font-size:11px"><div style="width:22px;height:22px;border-radius:6px;border:2px solid '+(kwDone?'var(--teal)':'rgba(42,184,168,.4)')+';background:'+(kwDone?'var(--teal)':'transparent')+';color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center">'+(kwDone?'&#10003;':'')+'</div>Kuechen-Waschbecken</div>';
        }
        html+='</div>';
      }

      // Kitchen toggle
      if(canEdit){
        html+='<div style="text-align:right;padding:2px 4px">';
        html+='<button data-room="'+room+'" data-action="si-room" style="font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid rgba(42,184,168,'+(rd2.kueche?'.8':'.2')+');background:'+(rd2.kueche?'rgba(42,184,168,.15)':'transparent')+';color:'+(rd2.kueche?'var(--teal)':'var(--muted)')+';cursor:pointer;font-family:inherit">&#127849; Küche</button>';
        html+='</div>';
      }
    }
    html+='</div>';
  }

  // Total silikon summary at bottom
  var totalSi=0;
  Object.keys(siData.rooms).forEach(function(r){
    var m=parseFloat((siData.rooms[r].silikonMenge||'').replace(',','.'));
    if(!isNaN(m))totalSi+=m;
  });
  if(totalSi>0){
    html+='<div style="background:var(--gdim);border:1px solid var(--gbor);border-radius:12px;padding:14px;text-align:center;margin-bottom:12px">';
    html+='<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Gesamtverbrauch Silikon</div>';
    html+='<div style="font-size:24px;font-weight:800;color:var(--gold)">'+totalSi.toFixed(1)+' Kartuschen</div>';
    html+='</div>';
  }

  return html;
}

boot();




































































</script>
</body>
</html>
