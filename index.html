<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bellman Ops">
<title>Bellman – Hotel Operations</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{
  --navy:#0d1b2e;--navy2:#162338;--navy3:#1e2f45;
  --gold:#c9a84c;--gold2:#e8c96a;--gdim:rgba(201,168,76,.15);--gbor:rgba(201,168,76,.3);
  --white:#f5f0e8;--muted:rgba(245,240,232,.5);
  --red:#e05252;--redbg:rgba(224,82,82,.12);--redbor:rgba(224,82,82,.3);
  --ora:#e09a2a;--orabg:rgba(224,154,42,.12);--orabor:rgba(224,154,42,.3);
  --grn:#3ab87a;--grnbg:rgba(58,184,122,.12);--grnbor:rgba(58,184,122,.3);
  --blu:#4a90d9;--blubg:rgba(74,144,217,.12);--blubor:rgba(74,144,217,.3);
  --pur:#b06bff;--purbg:rgba(176,107,255,.12);--purbor:rgba(176,107,255,.3);
  --teal:#2ab8a8;--tealbg:rgba(42,184,168,.12);--tealbor:rgba(42,184,168,.3);
  --rose:#e8608a;--rosebg:rgba(232,96,138,.12);--rosebor:rgba(232,96,138,.3);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);min-height:100dvh;overflow-x:hidden;font-size:15px;-webkit-text-size-adjust:100%}

/* HEADER */
.hdr{background:var(--navy2);border-bottom:1px solid var(--gbor);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;min-height:58px}
.hdr-l{display:flex;align-items:center;gap:10px;min-width:0}
/* Logo: Bellman Hotels wordmark */
.logo{display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;user-select:none;flex-shrink:0;padding:2px 0}
.logo-main{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--gold);letter-spacing:.5px;line-height:1}
.logo-sub{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:400;color:rgba(201,168,76,.65);letter-spacing:2px;text-transform:uppercase;line-height:1;margin-top:1px}
.hsub{font-size:11px;color:var(--muted);padding-left:1px;margin-top:1px}
.chip{display:flex;align-items:center;gap:6px;background:var(--navy3);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:7px 13px;font-size:13px;font-weight:600;flex-shrink:0;min-height:40px}
.chip-av{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.chip-name{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PERSONA BAR */
.pbar{background:rgba(201,168,76,.05);border-bottom:1px solid rgba(201,168,76,.18);padding:8px 14px;display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.pbar::-webkit-scrollbar{display:none}
.pbar-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);opacity:.6;flex-shrink:0}
.pbtn{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:6px 12px 6px 7px;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;min-height:36px}
.pbtn:hover{border-color:var(--gold)}
.pbtn.pon{background:var(--gdim);border-color:var(--gbor)}
.pbtn-av{width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.pbtn-n{font-size:12px;font-weight:600;color:var(--white)}
.pbtn-d{font-size:10px;color:var(--muted)}
.pbar-sep{width:1px;height:22px;background:rgba(255,255,255,.1);flex-shrink:0}

/* TABS */
.mtabs{background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.06);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:199}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex-shrink:0;padding:13px 18px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;user-select:none}
.mtab.on{color:var(--gold);border-bottom-color:var(--gold)}
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:700;margin-left:4px;padding:0 5px;vertical-align:middle}

/* FULLSCREEN / LOGIN */
.fullscreen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 20px 48px;overflow-y:auto}
/* Big Bellman logo on login screen */
.biglogo{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.biglogo-main{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:600;color:var(--gold);letter-spacing:1px;line-height:1}
.biglogo-sub{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:rgba(201,168,76,.65);letter-spacing:4px;text-transform:uppercase;margin-top:2px}
.biglogo-line{width:60px;height:1px;background:var(--gbor);margin:8px auto 0}
.fullscreen h1{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--white);margin-bottom:4px}
.fullscreen>p{font-size:14px;color:var(--muted);margin-bottom:26px;text-align:center}
.dept-section{width:100%;max-width:420px;margin-bottom:20px}
.dept-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.07)}
.staff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{background:var(--navy2);border-radius:12px;padding:16px 15px;cursor:pointer;transition:all .18s;border:1px solid rgba(255,255,255,.08);user-select:none;min-height:62px}
.sbtn:active{transform:scale(.96)}
.sbtn:hover{border-color:var(--gold);background:var(--navy3)}
.sbtn.son{border-color:var(--grn)!important;background:rgba(58,184,122,.08)!important}
.sbtn-name{font-size:16px;font-weight:600;color:var(--white)}
.sbtn-role{font-size:12px;color:var(--muted);margin-top:3px}
.sbtn.son .sbtn-role{color:var(--grn)}
.aform{width:100%;max-width:360px;background:var(--navy2);border:1px solid var(--gbor);border-radius:var(--r);padding:22px;margin-bottom:18px}
.aform h3{font-size:16px;font-weight:600;color:var(--gold);margin-bottom:16px}
.afinp{width:100%;background:var(--navy);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;margin-bottom:11px;transition:border-color .2s}
.afinp:focus{border-color:var(--gold)}
.afinp::placeholder{color:var(--muted)}
.asbtn{width:100%;padding:15px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;cursor:pointer;min-height:50px}
.aerr{font-size:13px;color:var(--red);margin-top:8px;text-align:center}

/* MAIN */
.main{padding:14px;max-width:620px;margin:0 auto}

/* SEARCH */
.srchwrap{position:relative;margin-bottom:12px}
.srchinp{width:100%;background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:13px 14px 13px 42px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;min-height:48px}
.srchinp:focus{border-color:var(--gold)}
.srchinp::placeholder{color:var(--muted)}
.srchico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;opacity:.5}
.srchclr{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:var(--white);width:26px;height:26px;border-radius:13px;font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center}
.srchclr.vis{display:flex}

/* STATS */
.sbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
.sbar3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.sbox{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 6px;text-align:center}
.snum{font-size:22px;font-weight:700;font-family:'Cormorant Garamond',serif;line-height:1}
.slbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.sd .snum{color:var(--red)}.sp .snum{color:var(--ora)}.sc .snum{color:var(--grn)}.sr .snum{color:var(--blu)}
.sb .snum{color:var(--teal)}.sg .snum{color:var(--grn)}.srk .snum{color:var(--rose)}

/* ADD BOX */
.addbox{background:var(--navy2);border:1px solid var(--gbor);border-radius:var(--r);padding:14px;margin-bottom:13px}
.addbox h3{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.type-row{display:flex;gap:6px;margin-bottom:10px}
.tbtn{flex:1;padding:11px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;user-select:none;min-height:44px}
.tbtn.tco  {background:var(--redbg);color:var(--red);border-color:var(--redbor)}
.tbtn.tblei{background:var(--tealbg);color:var(--teal);border-color:var(--tealbor)}
.tbtn.tgrn {background:var(--grnbg);color:var(--grn);border-color:var(--grnbor)}
.irow{display:flex;gap:8px}
.inp{flex:1;background:var(--navy);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:13px 14px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;transition:border-color .2s;min-height:48px}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--muted)}
.badd{border:none;border-radius:10px;padding:13px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:48px}
.badd.co  {background:var(--red);color:#fff}
.badd.blei{background:var(--teal);color:var(--navy)}
.badd.grn {background:var(--grn);color:var(--navy)}
.badd:active{opacity:.8}

/* FILTER TABS */
.ftabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:7px 13px;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;min-height:36px}
.ftab.on{background:var(--gdim);color:var(--gold);border-color:var(--gbor)}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.stitle{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.ldot{width:6px;height:6px;background:var(--grn);border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ROOM CARDS */
.rmc{background:var(--navy2);border-radius:var(--r);padding:14px 15px;margin-bottom:8px;border-left:4px solid transparent;animation:sli .2s ease}
@keyframes sli{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.rmc.dirty        {border-left-color:var(--red);background:linear-gradient(90deg,rgba(224,82,82,.07),var(--navy2))}
.rmc.progress     {border-left-color:var(--ora);background:linear-gradient(90deg,rgba(224,154,42,.07),var(--navy2))}
.rmc.clean        {border-left-color:var(--grn);background:linear-gradient(90deg,rgba(58,184,122,.07),var(--navy2))}
.rmc.ready        {border-left-color:var(--blu);background:linear-gradient(90deg,rgba(74,144,217,.07),var(--navy2))}
.rmc.bleiber      {border-left-color:var(--teal);background:linear-gradient(90deg,rgba(42,184,168,.07),var(--navy2))}
.rmc.bleiber-prog {border-left-color:var(--teal);background:linear-gradient(90deg,rgba(42,184,168,.11),var(--navy2))}
.rmc.bleiber-clean{border-left-color:var(--teal);background:linear-gradient(90deg,rgba(42,184,168,.07),var(--navy2))}
.rmc.green-option {border-left-color:var(--grn);background:linear-gradient(90deg,rgba(58,184,122,.09),var(--navy2))}
.rmc.rote-karte   {border-left-color:var(--rose);background:linear-gradient(90deg,rgba(232,96,138,.09),var(--navy2))}
.rmtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.rmnum{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 11px;border-radius:22px}
.pill.dirty        {background:var(--redbg);color:var(--red)}
.pill.progress     {background:var(--orabg);color:var(--ora)}
.pill.clean        {background:var(--grnbg);color:var(--grn)}
.pill.ready        {background:var(--blubg);color:var(--blu)}
.pill.bleiber      {background:var(--tealbg);color:var(--teal)}
.pill.bleiber-prog {background:var(--tealbg);color:var(--teal)}
.pill.bleiber-clean{background:var(--tealbg);color:var(--teal)}
.pill.green-option {background:var(--grnbg);color:var(--grn)}
.pill.rote-karte   {background:var(--rosebg);color:var(--rose)}
.tl-row{font-size:12px;color:var(--muted);line-height:2;margin-bottom:6px}
.by-tag{background:var(--navy3);border-radius:5px;padding:2px 7px;font-size:11px;color:rgba(245,240,232,.6)}
.mb-tag   {background:var(--gdim);border:1px solid var(--gbor);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--gold)}
.no-mb-tag{background:var(--redbg);border:1px solid var(--redbor);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--red)}
.info-tag {background:var(--tealbg);border:1px solid var(--tealbor);border-radius:5px;padding:3px 9px;font-size:12px;color:var(--teal);font-weight:600}
.green-tag{background:var(--grnbg);border:1px solid var(--grnbor);border-radius:5px;padding:3px 9px;font-size:12px;color:var(--grn);font-weight:600}
.rose-tag {background:var(--rosebg);border:1px solid var(--rosebor);border-radius:5px;padding:3px 9px;font-size:12px;color:var(--rose);font-weight:600}
.note-tag {background:rgba(201,168,76,.1);border:1px solid var(--gbor);border-radius:5px;padding:3px 9px;font-size:12px;color:var(--gold);display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-inp{background:var(--navy);border:1px solid var(--gbor);border-radius:9px;padding:10px 12px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;width:100%;margin-bottom:8px;min-height:46px}
.note-inp::placeholder{color:var(--muted)}
.nqbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.nqbtn{padding:7px 12px;border-radius:16px;border:1px solid rgba(201,168,76,.25);background:transparent;color:var(--gold);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;user-select:none;min-height:36px}
.nqbtn:active{background:var(--gdim)}

/* ACTION BUTTONS */
.arow{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.btn{flex:1;min-width:100px;padding:11px 12px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;user-select:none;min-height:46px}
.btn:active{transform:scale(.96)}
.btn-prog {background:var(--orabg);color:var(--ora);border:1px solid var(--orabor)}
.btn-cln  {background:var(--grnbg);color:var(--grn);border:1px solid var(--grnbor)}
.btn-del  {background:var(--redbg);color:var(--red);border:1px solid var(--redbor);font-size:12px}
.btn-gold {background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.btn-teal {background:var(--tealbg);color:var(--teal);border:1px solid var(--tealbor)}
.btn-rose {background:var(--rosebg);color:var(--rose);border:1px solid var(--rosebor)}
.btn-rep  {background:var(--purbg);color:var(--pur);border:1px solid var(--purbor)}
.btn-rprog{background:var(--orabg);color:var(--ora);border:1px solid var(--orabor)}
.btn-rdone{background:var(--grnbg);color:var(--grn);border:1px solid var(--grnbor)}

/* MINIBAR */
.mbox{background:var(--navy);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.mbox label{font-size:12px;color:var(--gold);font-weight:700;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.mb-qbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.mb-qbtn{padding:8px 12px;border-radius:16px;border:1px solid rgba(201,168,76,.2);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;user-select:none;min-height:38px}
.mb-qbtn.sel{background:var(--gdim);color:var(--gold);border-color:var(--gbor);font-weight:700}
.mb-summary{font-size:12px;color:var(--gold);min-height:18px}

/* REPAIR */
.repc{background:var(--navy2);border-radius:var(--r);padding:14px 15px;margin-bottom:8px;border-left:4px solid var(--pur);animation:sli .2s ease}
.repc.rp-progress{border-left-color:var(--ora);background:linear-gradient(90deg,rgba(224,154,42,.06),var(--navy2))}
.repc.rp-done    {border-left-color:var(--grn);background:linear-gradient(90deg,rgba(58,184,122,.06),var(--navy2));opacity:.75}
.reptop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.reploc{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1.1}
.reploc small{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:400;color:var(--muted);display:block;margin-top:2px}
.rppill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border-radius:20px;flex-shrink:0}
.rppill.rp-open    {background:var(--purbg);color:var(--pur);border:1px solid var(--purbor)}
.rppill.rp-progress{background:var(--orabg);color:var(--ora)}
.rppill.rp-done    {background:var(--grnbg);color:var(--grn)}
.repdesc{font-size:14px;line-height:1.5;margin-bottom:7px}
.repimg{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px;cursor:pointer}
.repmeta{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.9}
.repform{background:var(--navy2);border:1px solid var(--purbor);border-radius:var(--r);padding:15px;margin-bottom:14px}
.repform h3{font-size:13px;font-weight:700;color:var(--pur);margin-bottom:13px;text-transform:uppercase;letter-spacing:.5px}
.frow{margin-bottom:11px}
.flbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.ftxt,.fsel,.finp{width:100%;background:var(--navy);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 13px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;min-height:48px}
.ftxt:focus,.fsel:focus,.finp:focus{border-color:var(--pur)}
.ftxt::placeholder,.finp::placeholder{color:var(--muted)}
.ftxt{resize:none;height:72px;min-height:auto}
.fsel option{background:var(--navy2)}
.imgup{display:flex;align-items:center;gap:8px;background:var(--navy);border:1px dashed rgba(176,107,255,.4);border-radius:10px;padding:13px 14px;cursor:pointer;color:var(--pur);font-size:14px;font-weight:500;min-height:48px}
.imgprev{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:9px;display:none}
.fbtns{display:flex;gap:8px;margin-top:12px}
.bsubmit{flex:1;padding:13px;border-radius:10px;border:none;background:var(--pur);color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;min-height:48px}

function fbListen(){
  if(!db)return;
  db.ref('b8/rooms').on('value',s=>{const v=arr(s.val());if(v.length>=rooms.length){rooms=v;set('rooms',v);render();}});
  db.ref('b8/repairs').on('value',s=>{const v=arr(s.val());repairs=v;set('repairs',v);render();});
  db.ref('b8/shifts').on('value',s=>{if(s.val()&&typeof s.val()==='object'){shifts=s.val();set('shifts',shifts);render();}});
  db.ref('b8/staff').on('value',s=>{const v=s.val();if(v&&typeof v==='object'){staff=v;set('staff',v);render();}});
  db.ref('b8/mbItems').on('value',s=>{const v=s.val();if(Array.isArray(v)&&v.length>0){mbItems=v;set('mbItems',v);render();}});
  db.ref('b8/rezDep').on('value',s=>{const v=arr(s.val());rezDepList=v;set('rezDep',v);render();});
  db.ref('b8/vRooms').on('value',s=>{const v=s.val();if(v&&typeof v==='object'){Object.assign(vRooms,v);set('vRooms',vRooms);render();}});
}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector('[src="'+src+'"]')){res();return;}
    const s=document.createElement('script');
    s.src=src;s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}

// ─── BOOT ─────────────────────────────────────────────────────
function boot(){
  // 1. Daily reset
  const today=new Date().toDateString();
  if(get('today','')!==today){
    set('today',today);set('rooms',[]);set('rezDep',[]);
    set('vRooms',{co:[],blei:[],stay:[]});
  }
  // 2. Load local data
  rooms=arr(get('rooms',[]));
  repairs=arr(get('repairs',[]));
  shifts=get('shifts',{});
  staff=get('staff',DEFAULT_STAFF);
  mbItems=get('mbItems',DEFAULT_MB);

    set(CL_KEY,clData);

  const vr=get('vRooms',null);
  if(vr){vRooms.co=vr.co||[];vRooms.blei=vr.blei||[];vRooms.stay=vr.stay||[];}
  // 3. Load session

  screen=me?'main':'select';
  if(me) tab=me.dept==='technik'?'repair':'hk';

  render();
  // 5. Connect Firebase in background

    loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js')
      .then(()=>loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'))
      .then(()=>{
        if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
        db=firebase.database();
        return Promise.race([
          db.ref('.info/connected').once('value'),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000))
        ]);

      .then(()=>{
        db.ref('b8').update({rooms,repairs,shifts,staff,mbItems,rezDep:rezDepList,vRooms}).catch(()=>{});
        fbListen();
        showBanner(true);
      })
      .catch(e=>{console.warn('Firebase offline:',e.message);showBanner(false);});
  }, 100); // slight delay so app renders first
}

function addRoom(num){

  if(rooms.find(r=>r.number===num&&active.includes(r.status))){toast('⚠️ Zi. '+num+' bereits aktiv');return;}
  const st=addType==='co'?'dirty':addType==='blei'?'bleiber':'green-option';

}

function addRoteKarte(num){
  num=String(num||'').trim();if(!num){toast('⚠️ Zimmernummer eingeben');return;}
  const ex=rooms.find(r=>r.number===num&&['dirty','progress','bleiber','bleiber-prog'].includes(r.status));
  if(ex){ex.prevStatus=ex.status;ex.status='rote-karte';ex.tClean=nowT();ex.byClean=eu()?.name||'?';
    saveRooms();toast('🔴 Zi. '+num+' → Rote Karte');render();return;}
  if(rooms.find(r=>r.number===num&&r.status==='rote-karte')){toast('⚠️ Bereits Rote Karte');return;}
  rooms.push({id:gid(),number:num,status:'rote-karte',prevStatus:'bleiber',
    tCreated:nowT(),tProg:null,tClean:nowT(),tReady:null,minibar:null,
    byCO:eu()?.name||'?',byProg:null,byClean:eu()?.name||'?',byReady:null,note:'',type:'blei'});
  saveRooms();toast('🔴 Zi. '+num+' Rote Karte');render();
}

function hkAction(id,ns,extra){
  const r=rooms.find(r=>r.id===id);if(!r)return;
  const n=eu()?.name||'?';
  if(ns==='undo-rote-karte'){
    r.status=r.prevStatus||(r.type==='blei'?'bleiber':'dirty');r.prevStatus=null;
    saveRooms();toast('🔓 Zi. '+r.number);render();return;
  }
  if(ns==='undo-green'){
    r.status=r.prevStatus||'bleiber';r.prevStatus=null;
    saveRooms();toast('↩ Green aufgehoben');render();return;
  }
  if(ns==='rote-karte'||ns==='green-option') r.prevStatus=r.status;
  r.status=ns;
  if(['progress','bleiber-prog'].includes(ns)){r.tProg=nowT();r.byProg=n;}
  if(['clean','bleiber-clean','rote-karte'].includes(ns)){r.tClean=nowT();r.byClean=n;}
  if(ns==='ready'){r.tReady=nowT();r.byReady=n;r.minibar=extra&&extra.mb?extra.mb:null;}
  saveRooms();toast('Zi. '+r.number+' → '+ST_LBL[ns]);render();
}

// ─── PDF PARSER ───────────────────────────────────────────────
function parseLines(lines){
  const result={anreisen:[],imHaus:[],abreisen:[]};
  let section=null;
  for(const line of lines){
    const t=line.text.trim();
    if(!t)continue;
    if(t==='Anreisen'&&t.length<15){section='anreisen';continue;}
    if(t==='Im Haus'&&t.length<15){section='imHaus';continue;}
    if(t==='Abreisen'&&t.length<15){section='abreisen';continue;}
    if(/Berichtszeitraum|REZEPTIONSLISTE|Erstellungsdatum/i.test(t))continue;
    if(/^Zi\.\s|^Ki\.|^0-6|^\d+\s*\/\s*\d+$/.test(t))continue;
    if(!section)continue;
    const m=t.match(/^(\d{1,3})\s+\d{2}\.\d{2}\.\d{4}/);
    if(m){
      const num=m[1];
      if(!result[section].find(r=>r.num===num)){
        const nm=t.match(/^\d{1,3}\s+\d{2}\.\d{2}\.\d{4}\s+\d{2}\.\d{2}\.\d{4}\s+([^\d].*?)\s+\d\s+\d\s+\d/);
        result[section].push({num,name:nm?nm[1].trim():'',checkedOut:false});
      }
    }
  }
  ['anreisen','imHaus','abreisen'].forEach(s=>result[s].sort((a,b)=>parseInt(a.num)-parseInt(b.num)));
  return result;
}

function handlePDF(input){
  const f=input.files[0];if(!f)return;
  if(!window.pdfjsLib){
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';extractPDF(f);};
    document.head.appendChild(s);return;
  }
  extractPDF(f);
}

function extractPDF(file){
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
      const allLines=[];
      for(let p=1;p<=pdf.numPages;p++){
        const page=await pdf.getPage(p);
        const ph=page.getViewport({scale:1}).height;
        const content=await page.getTextContent();
        const byY={};
        for(const item of content.items){
          if(!item.str.trim())continue;
          const y=Math.round((ph-item.transform[5])*2)/2;
          const x=Math.round(item.transform[4]);
          if(!byY[y])byY[y]=[];
          byY[y].push({x,str:item.str});
        }
        for(const y of Object.keys(byY).map(Number).sort((a,b)=>a-b)){
          const items=byY[y].sort((a,b)=>a.x-b.x);
          const text=items.map(i=>i.str).join(' ').trim();
          if(text)allLines.push({text,firstX:items[0].x});
        }
      }
      const parsed=parseLines(allLines);
      if(!parsed.imHaus.length&&!parsed.abreisen.length&&!parsed.anreisen.length){
        vImportErr='Keine Zimmer gefunden.';render();return;
      }
      vParsed=parsed;vImportErr='';
      vRooms.blei=parsed.imHaus.map(r=>r.num);
      vRooms.co=parsed.abreisen.map(r=>r.num);
      vRooms.stay=parsed.anreisen.map(r=>r.num);
      saveVRooms();
      // Add bleiber to HK immediately
      const ACTIVE=['dirty','progress','clean','bleiber','bleiber-prog','bleiber-clean','rote-karte','green-option'];
      let added=0;
      parsed.imHaus.forEach(r=>{
        if(!rooms.find(x=>x.number===r.num&&ACTIVE.includes(x.status))){
          rooms.push({id:gid(),number:r.num,status:'bleiber',tCreated:nowT(),
            tProg:null,tClean:null,tReady:null,minibar:null,
            byCO:'Rezeptionsliste',byProg:null,byClean:null,byReady:null,note:'',type:'blei'});
          added++;
        }
      });
      if(added>0)saveRooms();
      // Update departure list
      const prev=new Set(rezDepList.filter(r=>r.checkedOut).map(r=>r.num));
      rezDepList=parsed.abreisen.map(r=>({num:r.num,name:r.name,note:'',checkedOut:prev.has(r.num)}));
      saveRezDep();
      toast('✓ '+parsed.imHaus.length+' Bleiber · '+parsed.abreisen.length+' Abreisen');
      render();
    }catch(err){vImportErr='PDF Fehler: '+err.message;render();}
  };
  reader.readAsArrayBuffer(file);
}

// ─── VERTEILUNG ───────────────────────────────────────────────
const MIN_BLEI=15, MIN_CO=30;
function round5(n){return Math.round(n/5)*5;}
function calcVerteilung(){
  const present=[...vPresent];
  if(!present.length){toast('⚠️ Niemand ausgewählt');return;}
  const co=(vRooms.co||[]).map(n=>({num:n,type:'co',min:MIN_CO}));
  const blei=(vRooms.blei||[]).map(n=>({num:n,type:'blei',min:MIN_BLEI}));
  const all=[...co,...blei];
  if(!all.length){toast('⚠️ Keine Zimmer');return;}
  const result={};
  present.forEach(n=>result[n]=[]);
  all.forEach((room,i)=>result[present[i%present.length]].push(room));
  const out=present.map(name=>{
    const myRooms=result[name];
    const totalMin=myRooms.reduce((s,r)=>s+r.min,0);
    const h=Math.floor(totalMin/60), m=totalMin%60;
    return{name,rooms:myRooms,totalMin,time:h+'h '+m+'min'};
  });
  // Render result
  const resDiv=document.getElementById('vresult');
  if(!resDiv)return;
  resDiv.innerHTML=out.map(x=>`
    <div class="vresult-row">
      <div class="vr-av">${ini(x.name)}</div>
      <div style="flex:1">
        <div class="vr-name">${esc(x.name)}</div>
        <div class="vr-count">${x.rooms.length} Zimmer · ${x.time}</div>
        <div class="vr-rooms">
          ${x.rooms.map(r=>`<span class="vr-room ${r.type==='co'?'co':'blei'}">${esc(r.num)}</span>`).join('')}
        </div>
      </div>
    </div>`).join('');
}

function renderRoomCard(r){
  const st=r.status;
  let actions='',extra='';
  const u=eu();

  // Checkout workflow
  if(canAct('progress')&&st==='dirty')
    actions+=`<button class="btn btn-prog" onclick="hkAction('${r.id}','progress')">▶ In Bearbeitung</button>`;
  if(canAct('clean')&&st==='progress')
    actions+=`<button class="btn btn-cln" onclick="hkAction('${r.id}','clean')">✓ Gereinigt</button>`;

  // Bleiber workflow
  if(canAct('bleiber_prog')&&st==='bleiber')
    actions+=`<button class="btn btn-teal" onclick="hkAction('${r.id}','bleiber-prog')">▶ In Bearbeitung</button>`;
  if(canAct('bleiber_clean')&&st==='bleiber-prog')
    actions+=`<button class="btn btn-teal" onclick="hkAction('${r.id}','bleiber-clean')">✓ Gereinigt</button>`;

  // Rote Karte
  if(canAct('rote_karte')&&!['rote-karte','ready','green-option','bleiber-clean','clean'].includes(st))
    actions+=`<button class="btn btn-rose" onclick="hkAction('${r.id}','rote-karte')">🔴 Rote Karte</button>`;
  if(canAct('undo_rote')&&st==='rote-karte')
    actions+=`<button class="btn btn-gold" style="width:100%" onclick="hkAction('${r.id}','undo-rote-karte')">🔓 ${['housekeeping','supervisor'].includes(u.dept)?'Schild weg – reinigen':'Rote Karte aufheben'}</button>`;

  // Green Option (nur Rezeption/Admin)
  if(canAct('green')&&['bleiber','dirty'].includes(st))
    actions+=`<button class="btn" style="background:var(--grnbg);color:var(--grn);border:1px solid var(--grnbor)" onclick="hkAction('${r.id}','green-option')">🌿 Green Option</button>`;
  if(canAct('green')&&st==='green-option')
    actions+=`<button class="btn btn-teal" onclick="hkAction('${r.id}','undo-green')">↩ Green aufheben</button>`;

  // Freigabe (Supervisor)
  if(canAct('release')&&['clean','bleiber-clean','green-option'].includes(st)){
    if(!mbSel[r.id])mbSel[r.id]=new Set();
    const sel=mbSel[r.id];
    const snacks=mbItems.filter(i=>["Brodericks","Chips","Taste","Jealous","Cookies","Nuts"].some(s=>i.startsWith(s)));
    const drinks=mbItems.filter(i=>!snacks.includes(i));
    const mbGroup=(lbl,items)=>items.length===0?'':
      `<div style="margin-bottom:6px"><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px">${lbl}</div>
      <div class="mb-qbtns">${items.map(item=>`<button class="mb-qbtn${sel.has(item)?' sel':''}" onclick="toggleMB('${r.id}','${esc(item)}')">${esc(item)}</button>`).join('')}</div></div>`;
    extra=`<div class="mbox"><label>🍾 Minibar – was wurde verbraucht?</label>
      ${mbGroup('Snacks',snacks)}${mbGroup('Drinks',drinks)}
      <div class="mb-summary">${sel.size>0?'✓ '+[...sel].join(' · '):'Nichts ausgewählt'}</div>
    </div>`;
    actions+=`<button class="btn btn-gold" onclick="doRelease('${r.id}')">${st==='green-option'?'🍾 Minibar & Freigeben':'⭐ Freigeben'}</button>`;
  }

  // Minibar display
  if(st==='ready'){
    extra=r.minibar?`<div style="margin-bottom:5px"><span class="mb-tag">🍾 ${esc(r.minibar)}</span></div>`:`<div style="margin-bottom:5px"><span class="no-mb-tag">Minibar leer</span></div>`;
  }

  // Admin delete
  if(me&&me.isAdmin&&!persona)
    actions+=`<button class="btn btn-del" style="flex:0;min-width:auto;padding:8px 10px" onclick="removeRoom('${r.id}')">🗑</button>`;

  // Status tags
  let stag='';
  if(st==='green-option'){
    const isSup=canAct('release');
    stag=`<div style="background:var(--grnbg);border:2px solid var(--grnbor);border-radius:10px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:8px">
      <span style="font-size:20px">🌿</span>
      <div><div style="font-size:13px;font-weight:700;color:var(--grn)">KEIN SERVICE – Nicht reinigen</div>
      <div style="font-size:11px;color:var(--muted)">${isSup?'Minibar prüfen und Zimmer freigeben':'Gast wünscht keine Reinigung'}</div></div></div>`;
  }
  if(st==='rote-karte'){
    const isBlei=['bleiber','bleiber-prog','blei'].includes(r.prevStatus||r.type||'');
    stag=`<div style="background:var(--rosebg);border:2px solid var(--rosebor);border-radius:10px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:8px">
      <span style="font-size:22px">🔴</span>
      <div style="flex:1"><div style="font-size:14px;font-weight:700;color:var(--rose)">ROTE KARTE – Nicht stören</div>
      <div style="font-size:11px;color:var(--muted)">${isBlei?'Bleiber':'Checkout'} – Schild weg = Button drücken</div></div></div>`;
  }
  if(['bleiber','bleiber-prog','bleiber-clean'].includes(st))
    stag=`<span class="info-tag">🛏 Bleiber</span> `;

  // Note block
  const canNote=canAct('note');
  const editing=noteId===r.id;
  let noteBlock='';
  if(editing){
    const QK=extraBtns;
    noteBlock=`<div style="margin-bottom:6px">
      <div class="nqbtns">${QK.map(q=>`<button class="nqbtn" onclick="window.appendNote('${r.id}','${q}')">${q}</button>`).join('')}</div>
      <input class="note-inp" id="note-inp-${r.id}" type="text" placeholder="Freitext..." maxlength="80">
      <div style="display:flex;gap:6px;margin-top:5px">
        <button class="btn btn-gold" style="flex:1;padding:7px" onclick="window.doSaveNote('${r.id}')">✓ Speichern</button>
        <button class="btn btn-del" style="flex:0;padding:7px 10px" onclick="noteId=null;render()">✕</button>
      </div></div>`;
  } else if(r.note){
    noteBlock=`<div style="margin-bottom:6px"><span class="note-tag">📝 ${esc(r.note)}</span>
      ${canNote?`<button style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-left:6px" onclick="noteId='${r.id}';render()">✎</button>`:''}
    </div>`;
  } else if(canNote&&!['ready','green-option','bleiber-clean'].includes(st)){
    noteBlock=`<div style="margin-bottom:5px"><button style="background:none;border:1px dashed rgba(201,168,76,.25);border-radius:6px;color:var(--muted);font-size:11px;cursor:pointer;padding:3px 9px;font-family:'DM Sans',sans-serif" onclick="noteId='${r.id}';render()">+ Notiz für HK</button></div>`;
  }

  // Timeline
  const tl=[];
  if(r.tCreated)tl.push(`📋 ${r.tCreated} <span class="by-tag">${esc(r.byCO||'?')}</span>`);
  if(r.tProg)tl.push(`▶ ${r.tProg} <span class="by-tag">${esc(r.byProg||'?')}</span>`);
  if(r.tClean)tl.push(`✓ ${r.tClean} <span class="by-tag">${esc(r.byClean||'?')}</span>`);
  if(r.tReady)tl.push(`⭐ ${r.tReady} <span class="by-tag">${esc(r.byReady||'?')}</span>`);

    ${tl.length?`<div class="tl-row">${tl.join(' · ')}</div>`:''}
    ${actions?`<div class="arow">${actions}</div>`:''}

}

window.doSelectStaff=function(name,dept){

  }
  saveMe({name,dept,isAdmin:false});

};

window.doAdminLogin=function(){
  const e=document.getElementById('al-e'),p=document.getElementById('al-p');
  if(!e||!p)return;
  const em=e.value.trim(),pw=p.value;
  const admin=ADMINS.find(a=>a.email===em&&a.pw===pw);
  if(!admin){loginErr='E-Mail oder Passwort falsch';render();return;}
  loginErr='';
  saveMe({name:admin.name,email:em,dept:'admin',isAdmin:true});
  screen='main';tab='hk';persona=null;render();
};

window.handleRepImg=function(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');const max=800,sc=i.width>max?max/i.width:1;c.width=i.width*sc;c.height=i.height*sc;c.getContext('2d').drawImage(i,0,0,c.width,c.height);rfData.img=c.toDataURL('image/jpeg',.72);const pv=document.getElementById('rf-prev');if(pv){pv.src=rfData.img;pv.style.display='block';}};i.src=e.target.result;};
  r.readAsDataURL(f);
};

// ── REPAIR TIMER ─────────────────────────────────────
function rpTime(min){if(!min||min<=0)return'';if(min<60)return min+'min';return Math.floor(min/60)+'h '+(min%60)+'min';}

function acceptRepairTimed(id){
  var r=repairs.find(function(x){return x.id===id;});
  if(!r)return;
  r.status='rp-progress';r.tAccepted=nowT();
  r.byAccepted=(eu()&&eu().name)||'?';
  r.tStart=Date.now();r.elapsedMin=r.elapsedMin||0;
  saveRepairs();toast('\u25b6 Angenommen');render();
}
function parkRepair(id){
  var r=repairs.find(function(x){return x.id===id;});
  if(!r)return;
  if(r.tStart){r.elapsedMin=(r.elapsedMin||0)+Math.round((Date.now()-r.tStart)/60000);r.tStart=null;}
  r.status='rp-parked';saveRepairs();toast('\u23f8 Geparkt');render();
}
function resumeRepair(id){
  var r=repairs.find(function(x){return x.id===id;});
  if(!r)return;
  r.status='rp-progress';r.tStart=Date.now();
  saveRepairs();toast('\u25b6 Fortgesetzt');render();
}
function doneRepairTimed(id){
  var r=repairs.find(function(x){return x.id===id;});
  if(!r)return;
  if(r.tStart){r.elapsedMin=(r.elapsedMin||0)+Math.round((Date.now()-r.tStart)/60000);r.tStart=null;}
  r.status='rp-done';r.tDone=nowT();
  r.byDone=(eu()&&eu().name)||'?';
  saveRepairs();toast('\u2713 Erledigt - '+rpTime(r.elapsedMin));render();
}
function saveMatNote(id,val){
  var r=repairs.find(function(x){return x.id===id;});
  if(r){r.matNote=val;saveRepairs();}
}

// ── TECH STATUS ───────────────────────────────────────
function getTechStatus(name){
  for(var i=0;i<repairs.length;i++){
    var r=repairs[i];
    if((r.status==='rp-progress'||r.status==='rp-parked')&&r.byAccepted===name){
      return (r.status==='rp-parked'?'\u23f8':'\uD83D\uDD27')+' '+r.loc+(r.workType?' \xb7 '+r.workType:'');
    }
  }
  return '';
}

}

function renderDashboardTab(){
  var h='<div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:14px;text-transform:uppercase;letter-spacing:.8px">Dashboard</div>';
  // HK
  var dirty=0,prog=0,clean=0,ready=0;
  for(var i=0;i<rooms.length;i++){var rs=rooms[i].status;if(rs==='dirty')dirty++;else if(rs==='progress')prog++;else if(rs==='clean')clean++;else if(rs==='ready')ready++;}
  h+=dashCard('Housekeeping',[{l:'Schmutzig',v:dirty,c:'#ff6666'},{l:'In Bearbeitung',v:prog,c:'#ffaa33'},{l:'Gereinigt',v:clean,c:'#4499ff'},{l:'Erledigt',v:ready,c:'#22cc44'}],rooms.length);
  // Repairs
  var rO=0,rP=0,rPk=0,rD=0;
  for(var ri=0;ri<repairs.length;ri++){var st=repairs[ri].status;if(st==='rp-open')rO++;else if(st==='rp-progress')rP++;else if(st==='rp-parked')rPk++;else if(st==='rp-done')rD++;}
  h+=dashCard('Reparaturen',[{l:'Offen',v:rO,c:'#ff6666'},{l:'In Bearbeitung',v:rP,c:'#ffaa33'},{l:'Geparkt',v:rPk,c:'#aaaaff'},{l:'Erledigt',v:rD,c:'#22cc44'}],repairs.length);
  // Progress bars
  var clDone2=0;for(var k in clData.items)if(clData.items[k])clDone2++;
  var clPct=CL_ITEMS.length>0?Math.round(clDone2/CL_ITEMS.length*100):0;
  var siDoneC=SI_ROOMS.filter(function(r){return siData.rooms&&siData.rooms[r]&&siData.rooms[r].done;}).length;
  var siPct=Math.round(siDoneC/SI_ROOMS.length*100);
  h+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
  h+='<div style="font-size:12px;margin-bottom:7px">Checkliste <span style="color:'+(clData.status==='cl-done'?'#22cc44':clData.status==='cl-accepted'?'#ffaa33':'#ff6666')+'">'+clPct+'%</span></div>';
  h+='<div style="background:rgba(0,0,0,.3);border-radius:4px;height:5px"><div style="background:#22cc44;height:5px;border-radius:4px;width:'+clPct+'%"></div></div>';
  h+='<div style="font-size:12px;margin-top:10px;margin-bottom:7px">Silikon <span style="color:'+(siData.status==='si-done'?'#22cc44':siData.status==='si-accepted'?'#ffaa33':'#ff6666')+'">'+siPct+'%</span></div>';
  h+='<div style="background:rgba(0,0,0,.3);border-radius:4px;height:5px"><div style="background:#4499ff;height:5px;border-radius:4px;width:'+siPct+'%"></div></div>';
  h+='</div>';
  // Location chart
  if(repairs.length>0){
    var locC={};
    for(var li=0;li<repairs.length;li++){var loc=repairs[li].loc||'?';locC[loc]=(locC[loc]||0)+1;}
    var locS=Object.keys(locC).sort(function(a,b){return locC[b]-locC[a];}).slice(0,6);
    if(locS.length>0){
      var maxL=locC[locS[0]];
      h+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
      h+='<div style="font-size:13px;font-weight:700;margin-bottom:10px">Haeufigste Problemorte</div>';
      for(var li2=0;li2<locS.length;li2++){
        var lk=locS[li2];var lv=locC[lk];var lp=Math.round(lv/maxL*100);
        var shortLoc=lk.indexOf(' - ')>0?lk.split(' - ').pop():lk;
        h+='<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>'+esc(shortLoc)+'</span><span style="color:var(--muted)">'+lv+'x</span></div>';
        h+='<div style="background:rgba(0,0,0,.3);border-radius:3px;height:4px"><div style="background:var(--gold);height:4px;border-radius:3px;width:'+lp+'%"></div></div></div>';
      }
      h+='</div>';
    }
    // Work type chart
    var wtC={};
    for(var wi=0;wi<repairs.length;wi++){var wt=repairs[wi].workType;if(wt){var ws=repairs[wi].workSub;var wk=wt+(ws?' - '+ws:'');wtC[wk]=(wtC[wk]||0)+1;}}
    var wtS=Object.keys(wtC).sort(function(a,b){return wtC[b]-wtC[a];}).slice(0,5);
    if(wtS.length>0){
      var maxW=wtC[wtS[0]];
      h+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
      h+='<div style="font-size:13px;font-weight:700;margin-bottom:10px">Haeufigste Arbeiten</div>';
      for(var wi2=0;wi2<wtS.length;wi2++){
        var wk2=wtS[wi2];var wv=wtC[wk2];var wp=Math.round(wv/maxW*100);
        h+='<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>'+esc(wk2)+'</span><span style="color:var(--muted)">'+wv+'x</span></div>';
        h+='<div style="background:rgba(0,0,0,.3);border-radius:3px;height:4px"><div style="background:#4499ff;height:4px;border-radius:3px;width:'+wp+'%"></div></div></div>';
      }
      h+='</div>';
    }
    // Total time
    var totalMin=0;for(var ti=0;ti<repairs.length;ti++)totalMin+=(repairs[ti].elapsedMin||0);
    if(totalMin>0){
      h+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">';
      h+='<div style="font-size:13px;font-weight:700">Gesamtarbeitszeit</div>';
      h+='<div style="font-size:18px;font-weight:800;color:var(--gold)">'+rpTime(totalMin)+'</div>';
      h+='</div>';
    }
    // Archive
    var doneRps=repairs.filter(function(r){return r.status==='rp-done';});
    if(doneRps.length>0){
      h+='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center">';
      h+='<div style="font-size:13px;font-weight:700">Erledigte Auftraege ('+doneRps.length+')</div>';
      h+='<button onclick="showArchive=!showArchive;render()" style="padding:5px 11px;border:1px solid rgba(255,255,255,.2);border-radius:7px;background:transparent;color:var(--white);font-size:12px;cursor:pointer;font-family:inherit">'+(showArchive?'Schliessen':'Anzeigen')+'</button>';
      h+='</div>';
      if(showArchive){
        var sorted=doneRps.slice().sort(function(a,b){return(b.tDone||'')>(a.tDone||'')?1:-1;});
        h+='<div style="margin-top:10px">';
        for(var ai=0;ai<sorted.length;ai++){
          var ar=sorted[ai];var el=ar.elapsedMin?rpTime(ar.elapsedMin):'';
          h+='<div style="padding:9px;background:rgba(0,0,0,.2);border-radius:9px;margin-bottom:7px;border-left:3px solid #22cc44">';
          h+='<div style="display:flex;justify-content:space-between;margin-bottom:3px">';
          h+='<div style="font-size:13px;font-weight:600">'+esc(ar.loc)+'</div>';
          h+='<div style="font-size:10px;color:var(--muted)">'+esc(ar.date||'')+'</div></div>';
          if(ar.workType)h+='<span style="font-size:11px;background:var(--gdim);color:var(--gold);padding:1px 6px;border-radius:4px">'+esc(ar.workType)+(ar.workSub?' - '+esc(ar.workSub):'')+'</span> ';
          if(ar.area)h+='<span style="font-size:11px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);padding:1px 6px;border-radius:4px">'+esc(ar.area)+'</span>';
          if(ar.desc)h+='<div style="font-size:12px;color:rgba(255,255,255,.7);margin-top:3px">'+esc(ar.desc)+'</div>';
          if(ar.matNote)h+='<div style="font-size:11px;color:var(--muted);margin-top:2px">Material: '+esc(ar.matNote)+'</div>';
          h+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px">';
          h+='<span>'+esc(ar.by||'?')+' zu '+esc(ar.byDone||'?')+'</span>';
          if(el)h+='<span style="color:#22cc44">'+el+'</span>';
          h+='</div></div>';
        }
        h+='</div>';
      }
      h+='</div>';
    }
  }
  return h;
}
function dashCard(title,stats,total){
  var h='<div style="background:var(--navy2);border-radius:12px;padding:14px;margin-bottom:12px">';
  h+='<div style="font-size:13px;font-weight:700;margin-bottom:10px">'+title+' <span style="font-weight:400;color:rgba(255,255,255,.4);font-size:12px">'+total+' ges.</span></div>';
  h+='<div style="display:flex;gap:7px;flex-wrap:wrap">';
  for(var i=0;i<stats.length;i++){
    var s=stats[i];
    h+='<div style="flex:1;min-width:52px;background:rgba(0,0,0,.2);border-radius:8px;padding:9px 6px;text-align:center;border:1px solid '+s.c+'33">';
    h+='<div style="font-size:19px;font-weight:800;color:'+s.c+'">'+s.v+'</div>';
    h+='<div style="font-size:10px;color:rgba(255,255,255,.4);margin-top:1px">'+s.l+'</div></div>';
  }
  h+='</div></div>';
  return h;
}

function roomClAccept(num){
  var d=getRoomCl(num);
  d.status='in_progress';d.acceptedBy=(eu()&&eu().name)||'?';d.tStart=nowT();
  saveRoomClData();render();
}
function roomClDone(num){
  var d=getRoomCl(num);
  d.status='done';d.tDone=nowT();
  saveRoomClData();toast('Zi. '+num+' Wartung abgeschlossen');render();
}
function roomClReset(num){
  roomClData[num]={status:'open',acceptedBy:null,tStart:null,tDone:null,items:{},notes:'',maengelDone:{}};
  saveRoomClData();render();
}
function roomClToggle(num,id){
  var d=getRoomCl(num);
  if(d.status==='done')return;
  if(d.status==='open')d.status='in_progress';
  if(!d.items)d.items={};
  d.items[id]=!d.items[id];
  saveRoomClData();
}
function roomClMaengelToggle(num,idx){
  var d=getRoomCl(num);
  if(d.status==='done')return;
  if(d.status==='open')d.status='in_progress';
  if(!d.maengelDone)d.maengelDone={};
  d.maengelDone[idx]=!d.maengelDone[idx];
  saveRoomClData();
}
function roomClNote(num,val){
  var d=getRoomCl(num);d.notes=val;saveRoomClData();
}

function renderRoomChecklistTab(){
  var u=eu();
  var floors=[[101,118],[201,219],[301,318],[401,417],[501,517],[601,609]];
  var etNames=['1. OG','2. OG','3. OG','4. OG','5. OG','6. OG'];
  var total=0,done=0,inProg=0;
  for(var fi=0;fi<floors.length;fi++){
    for(var n=floors[fi][0];n<=floors[fi][1];n++){
      total++;
      var rd=roomClData[String(n)];
      if(rd&&rd.status==='done')done++;
      else if(rd&&rd.items&&Object.keys(rd.items).some(function(k){return rd.items[k];}))inProg++;
    }
  }
  var h='';
  h+='<div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px">Zimmer-Wartungscheckliste</div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:16px">';
  h+='<div style="flex:1;background:rgba(0,0,0,.2);border-radius:8px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:800;color:#ff6666">'+(total-done-inProg)+'</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Offen</div></div>';
  h+='<div style="flex:1;background:rgba(0,0,0,.2);border-radius:8px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:800;color:#ffaa33">'+inProg+'</div><div style="font-size:10px;color:rgba(255,255,255,.4)">In Arbeit</div></div>';
  h+='<div style="flex:1;background:rgba(0,0,0,.2);border-radius:8px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:800;color:#22cc44">'+done+'</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Fertig</div></div>';
  h+='</div>';
  for(var fi2=0;fi2<floors.length;fi2++){
    var fRooms=[];
    for(var fn2=floors[fi2][0];fn2<=floors[fi2][1];fn2++) fRooms.push(String(fn2));
    var fDone=fRooms.filter(function(r){return roomClData[r]&&roomClData[r].status==='done';}).length;
    h+='<div style="margin-bottom:12px">';
    h+='<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.06)">'+etNames[fi2]+' <span style="color:#22cc44">'+fDone+'/'+fRooms.length+'</span></div>';
    for(var fj=0;fj<fRooms.length;fj++){
      var num=fRooms[fj];
      var rd2=roomClData[num]||{status:'open',items:{},notes:'',maengelDone:{}};
      var maengel=ROOM_MAENGEL[num]||[];
      var iDone=0; if(rd2.items)for(var kk in rd2.items)if(rd2.items[kk])iDone++;
      var mDone=0; if(rd2.maengelDone)for(var mi=0;mi<maengel.length;mi++)if(rd2.maengelDone[mi])mDone++;
      var totalDone=iDone+mDone;
      var totalItems=ROOM_CL_ITEMS.length+maengel.length;
      var isDone=rd2.status==='done';
      var stCol=isDone?'#22cc44':totalDone>0?'#ffaa33':'rgba(255,255,255,.3)';
      var stLbl=isDone?'Fertig':totalDone>0?(totalDone+'/'+totalItems):maengel.length>0?(maengel.length+' M'):'Offen';
      var borderCol=isDone?'rgba(34,200,68,.3)':maengel.length>0?'rgba(255,102,102,.2)':'rgba(255,255,255,.06)';
      h+='<div data-rcl-room="'+num+'" style="background:var(--navy2);border-radius:8px;margin-bottom:4px;border:1px solid '+borderCol+';padding:10px 13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between">';
      h+='<div><span style="font-size:15px;font-weight:700;color:'+(isDone?'#22cc44':'var(--white)')+'">Zi. '+num+'</span>';
      if(maengel.length>0) h+=' <span style="font-size:10px;background:rgba(255,100,100,.2);color:#ff8888;padding:1px 5px;border-radius:3px;margin-left:4px">'+maengel.length+' M</span>';
      h+='</div>';
      h+='<span style="font-size:11px;color:'+stCol+';font-weight:600">'+stLbl+' &#9654;</span>';
      h+='</div>';
    }
    h+='</div>';
  }
  return h;
}

function getRoomCl(num){
  if(!roomClData[num])roomClData[num]={status:'open',acceptedBy:null,tStart:null,tDone:null,items:{},notes:'',maengelDone:{}};
  return roomClData[num];
}
function renderRoomDetail(num){
  var u=eu();
  var canEdit=(u.dept==='technik'||u.dept==='admin');
  var rd=getRoomCl(num);
  var maengel=ROOM_MAENGEL[num]||[];
  var iDone=0; if(rd.items)for(var k in rd.items)if(rd.items[k])iDone++;
  var mDone=0; if(rd.maengelDone)for(var mi=0;mi<maengel.length;mi++)if(rd.maengelDone[mi])mDone++;
  var totalItems=ROOM_CL_ITEMS.length+maengel.length;
  var totalDone=iDone+mDone;
  var pct=totalItems>0?Math.round(totalDone/totalItems*100):0;
  var isDone=rd.status==='done';
  var h='<div id="rcl-detail" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0d1b2e;z-index:999;overflow-y:auto;padding:16px;box-sizing:border-box">';
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">';
  h+='<button id="rcl-back" style="background:rgba(255,255,255,.1);border:none;color:var(--white);padding:8px 14px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px">&#8592; Zurueck</button>';
  h+='<span style="font-size:16px;font-weight:700;color:var(--gold)">Zimmer '+num+'</span>';
  if(isDone) h+='<span style="font-size:11px;color:#22cc44;font-weight:600">&#10003; Fertig</span>';
  h+='</div>';
  h+='<div style="background:rgba(0,0,0,.3);border-radius:4px;height:4px;margin-bottom:8px"><div style="background:#ffaa33;height:4px;border-radius:4px;width:'+pct+'%"></div></div>';
  h+='<div style="font-size:11px;color:rgba(255,255,255,.4);margin-bottom:12px">'+totalDone+'/'+totalItems+' erledigt</div>';
  if(maengel.length>0){
    h+='<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#ff8888;margin-bottom:6px">MAENGEL ('+mDone+'/'+maengel.length+')</div>';
    for(var mj=0;mj<maengel.length;mj++){
      var mChk=!!(rd.maengelDone&&rd.maengelDone[mj]);
      h+='<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,102,102,.1)">';
      h+='<div data-rcl-mtog="'+num+'" data-rcl-midx="'+mj+'" style="width:22px;height:22px;min-width:22px;border-radius:5px;border:2px solid '+(mChk?'#22cc44':'rgba(255,102,102,.5)')+';background:'+(mChk?'#22cc44':'transparent')+';cursor:'+(canEdit&&!isDone?'pointer':'default')+';display:flex;align-items:center;justify-content:center">';
      if(mChk) h+='<span style="color:#0d1b2e;font-size:12px;pointer-events:none">&#10003;</span>';
      h+='</div>';
      h+='<div style="font-size:12px;color:'+(mChk?'rgba(255,255,255,.3)':'#ff9999')+';'+(mChk?'text-decoration:line-through;':'')+'">'+(maengel[mj]||'').replace(/</g,'&lt;')+'</div>';
      h+='</div>';
    }
    h+='<div style="height:10px"></div>';
  }
  var cats={};var catOrd=[];
  for(var ii=0;ii<ROOM_CL_ITEMS.length;ii++){
    var it=ROOM_CL_ITEMS[ii];
    if(!cats[it.cat]){cats[it.cat]=[];catOrd.push(it.cat);}
    cats[it.cat].push(it);
  }
  h+='<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:6px">STANDARDWARTUNG ('+iDone+'/'+ROOM_CL_ITEMS.length+')</div>';
  for(var ci=0;ci<catOrd.length;ci++){
    h+='<div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.25);margin:8px 0 4px;text-transform:uppercase">'+catOrd[ci]+'</div>';
    var its=cats[catOrd[ci]];
    for(var ij=0;ij<its.length;ij++){
      var it2=its[ij];
      var chk=!!(rd.items&&rd.items[it2.id]);
      h+='<div style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)">';
      h+='<div data-rcl-tog="'+num+'" data-rcl-id="'+it2.id+'" style="width:22px;height:22px;min-width:22px;border-radius:5px;border:2px solid '+(chk?'#22cc44':'rgba(255,255,255,.2)')+';background:'+(chk?'#22cc44':'transparent')+';cursor:'+(canEdit&&!isDone?'pointer':'default')+';display:flex;align-items:center;justify-content:center">';
      if(chk) h+='<span style="color:#0d1b2e;font-size:12px;pointer-events:none">&#10003;</span>';
      h+='</div>';
      h+='<div style="font-size:12px;color:'+(chk?'rgba(255,255,255,.3)':'rgba(255,255,255,.85)')+';'+(chk?'text-decoration:line-through;':'')+'">'+(it2.l||'').replace(/</g,'&lt;')+'</div>';
      h+='</div>';
    }
  }
  h+='<div style="margin-top:14px">';
  h+='<div style="font-size:10px;color:rgba(255,255,255,.3);margin-bottom:4px">NOTIZEN</div>';
  h+='<textarea id="rcl-note-'+num+'" rows="3" style="width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:var(--white);font-size:12px;padding:8px;font-family:inherit;resize:vertical;box-sizing:border-box"'+(isDone?' disabled':'')+'>'+(rd.notes||'').replace(/</g,'&lt;')+'</textarea>';
  h+='</div>';
  if(canEdit&&!isDone){
    h+='<button data-rcl-done="'+num+'" style="width:100%;padding:12px;border:none;border-radius:8px;background:#22cc44;color:#0d1b2e;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px">&#10003; Wartung abschliessen</button>';
  }
  if(isDone&&u.dept==='admin'){
    h+='<button data-rcl-reset="'+num+'" style="width:100%;padding:8px;border:1px solid #cc3333;border-radius:7px;background:#1a0a0a;color:#ff6666;font-size:12px;cursor:pointer;font-family:inherit;margin-top:8px">Reset</button>';
  }
  h+='<div style="height:40px"></div></div>';
  return h;
}




// ── Zimmerwartung Event Handler ──────────────────────────────
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='rcl-back'){
    var det=document.getElementById('rcl-detail');
    if(det)det.remove();
    return;
  }
  var card=e.target.closest('[data-rcl-room]');
  if(card){
    var rnum=card.getAttribute('data-rcl-room');
    var old=document.getElementById('rcl-detail');
    if(old)old.remove();
    document.body.insertAdjacentHTML('beforeend',renderRoomDetail(rnum));
    return;
  }
  var t=e.target.closest('[data-rcl-tog],[data-rcl-mtog],[data-rcl-done],[data-rcl-reset]');
  if(!t)return;
  var tog=t.getAttribute('data-rcl-tog');
  var mtog=t.getAttribute('data-rcl-mtog');
  var done=t.getAttribute('data-rcl-done');
  var reset=t.getAttribute('data-rcl-reset');
  if(tog){
    roomClToggle(tog,t.getAttribute('data-rcl-id'));
    var det2=document.getElementById('rcl-detail');
    if(det2){det2.remove();document.body.insertAdjacentHTML('beforeend',renderRoomDetail(tog));}
  } else if(mtog){
    roomClMaengelToggle(mtog,parseInt(t.getAttribute('data-rcl-midx')));
    var det3=document.getElementById('rcl-detail');
    if(det3){det3.remove();document.body.insertAdjacentHTML('beforeend',renderRoomDetail(mtog));}
  } else if(done){
    roomClDone(done);
    var det4=document.getElementById('rcl-detail');
    if(det4)det4.remove();
    render();
  } else if(reset){
    roomClReset(reset);
    var det5=document.getElementById('rcl-detail');
    if(det5)det5.remove();
    render();
  }
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id&&e.target.id.indexOf('rcl-note-')===0){
    var nnum=e.target.id.replace('rcl-note-','');
    roomClNote(nnum,e.target.value);
  }
});

boot();
